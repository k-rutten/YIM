        };

        /* ===== TOAST (Figma: bottom-right, teal bg, white text) ===== */
        const ToastCtx=React.createContext(null);
        function ToastWrap({children}){const[t,sT]=useState(null);const show=useCallback((m,tp='info')=>sT({m,tp}),[]);return<ToastCtx.Provider value={show}>{children}{t&&<Toast msg={t.m} tp={t.tp} onX={()=>sT(null)}/>}</ToastCtx.Provider>;}
        const useToast=()=>React.useContext(ToastCtx);
        function Toast({msg,tp,onX}){useEffect(()=>{const t=setTimeout(onX,3500);return()=>clearTimeout(t)},[onX]);return<div className="fixed bottom-6 right-6 z-50 slide-in bg-yim-600 px-5 py-3.5 rounded-xl shadow-lg flex items-center gap-3 overflow-hidden"><span className="text-sm font-semibold text-white">{msg}</span><button onClick={onX} className="ml-3 text-white/70 hover:text-white">{I.x("w-4 h-4")}</button><div className="absolute bottom-0 left-0 h-1 bg-yim-green toast-progress rounded-b-xl"/></div>;}

        /* ===== SHARED UI ===== */
        function Badge({status,label}){
            if(status==='active')return<span className="inline-flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-yim-green"/><span className="text-[10px] font-bold text-yim-700 uppercase tracking-wider">{label||'Actief'}</span></span>;
            if(status==='blocked')return<span className="inline-flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-yim-red"/><span className="text-[10px] font-bold text-yim-red uppercase tracking-wider">{label||'Geblokkeerd'}</span></span>;
            if(status==='revoked')return<span className="inline-flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-yim-orange"/><span className="text-[10px] font-bold text-yim-orange uppercase tracking-wider">{label||'Ingetrokken'}</span></span>;
            return<span className="inline-flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-gray-300"/><span className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">{label||'Verwijderd'}</span></span>;
        }
        /* Figma "Op blacklist" red pill badge */
        function BlPill(){return<span className="inline-block bg-yim-red text-white text-[11px] font-bold px-2.5 py-0.5 rounded-sm uppercase">Op blacklist</span>;}

        function Modal({isOpen,onClose,title,children,maxW='max-w-2xl'}){if(!isOpen)return null;return<div className="fixed inset-0 z-40 flex items-center justify-center bg-black/40" onClick={onClose}><div className={`bg-white rounded-xl shadow-2xl ${maxW} w-full mx-4 fade-in max-h-[90vh] flex flex-col`} onClick={e=>e.stopPropagation()}><div className="flex items-center justify-between px-6 py-4 border-b border-yim-200"><h2 className="text-lg font-bold text-yim-700">{title}</h2><button onClick={onClose} className="text-yim-400 hover:text-yim-700">{I.x("w-5 h-5")}</button></div><div className="overflow-y-auto p-6">{children}</div></div></div>;}

        /* Figma-style confirmation dialog */
        function FigmaPopup({isOpen,onClose,onOk,title,msg,label='Bevestigen',danger}){if(!isOpen)return null;return<div className="fixed inset-0 z-50 flex items-center justify-center bg-black/20" onClick={onClose}><div className="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4 fade-in p-8 relative" onClick={e=>e.stopPropagation()}><button onClick={onClose} className="absolute top-6 right-6 w-8 h-8 rounded-full border border-yim-300 flex items-center justify-center text-yim-400 hover:text-yim-700 hover:border-yim-700">{I.x("w-4 h-4")}</button><h3 className="text-2xl font-bold text-yim-700 mb-3 pr-10">{title}</h3><p className="text-sm text-yim-700 leading-relaxed">{msg}</p><div className="flex justify-start gap-3 mt-6"><button onClick={onClose} className="px-5 py-2.5 text-sm font-semibold text-yim-700 bg-white border border-yim-300 rounded-md hover:bg-yim-50">Annuleren</button><button onClick={onOk} className={`px-5 py-2.5 text-sm font-semibold text-white rounded-md ${danger?'bg-yim-red hover:bg-red-600':'bg-yim-500 hover:bg-yim-600'}`}>{label}</button></div></div></div>;}

        function DRow({label,children}){return<div className="flex border-b border-yim-100 py-3"><div className="w-1/3 text-sm text-yim-900/60 pl-4 font-normal">{label}</div><div className="w-2/3 text-sm text-yim-700 font-semibold">{children}</div></div>;}
        function Section({title,children}){return<div className="bg-white rounded-[10px] border border-yim-200 overflow-hidden mb-6"><h3 className="text-2xl font-bold text-yim-700 px-6 py-5 border-b border-yim-100">{title}</h3><div>{children}</div></div>;}
        function YTable({cols,children,empty}){return<div className="bg-yim-50 border border-yim-200 rounded-[10px] overflow-hidden"><table className="w-full text-sm"><thead><tr className="bg-yim-700">{cols.map((c,i)=><th key={i} className={`text-left px-6 py-2.5 text-sm font-normal text-white ${i>0?'border-l border-white/10':''}`}>{c}{c&&<svg className="inline-block w-3 h-3 ml-1.5 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>}</th>)}</tr></thead><tbody className="bg-yim-50">{children||(empty&&<tr><td colSpan={cols.length} className="px-6 py-8 text-center text-yim-400">{empty}</td></tr>)}</tbody></table></div>;}
        function Pager({page,total,onPage,count,perPage}){if(total<=1)return null;return<div className="flex items-center justify-between px-4 py-2 bg-white border-t border-yim-200"><div className="flex items-center gap-2">{[{l:'«',p:0},{l:'‹',p:Math.max(0,page-1)}].map((b,i)=><button key={i} onClick={()=>onPage(b.p)} disabled={page===0} className="w-[38px] h-[38px] rounded-full bg-yim-500/30 text-yim-700 flex items-center justify-center disabled:opacity-30 hover:bg-yim-500/50 text-sm font-medium">{b.l}</button>)}<span className="w-[38px] h-[38px] rounded-full bg-yim-500/30 text-yim-500 flex items-center justify-center text-sm font-medium">{page+1}</span>{[{l:'›',p:Math.min(total-1,page+1)},{l:'»',p:total-1}].map((b,i)=><button key={i} onClick={()=>onPage(b.p)} disabled={page>=total-1} className="w-[38px] h-[38px] rounded-full bg-yim-500/30 text-yim-700 flex items-center justify-center disabled:opacity-30 hover:bg-yim-500/50 text-sm font-medium">{b.l}</button>)}</div><div className="flex items-center gap-3"><span className="text-sm font-bold text-yim-700">{perPage} items per pagina</span><span className="text-sm text-yim-400">{page*perPage+1} - {Math.min((page+1)*perPage,count)} van {count} items</span></div></div>;}

        /* ===== MIJN ACTIES SIDEBAR (Figma: bg #265263/yim-700, top-right 110px radius, 300px) ===== */
        function MijnActies({actions,email}){
            return<div className="w-[300px] flex-shrink-0">
                <div className="bg-yim-700 pt-[50px] pb-[30px] px-5 sticky top-28 relative overflow-hidden" style={{borderRadius:'10px 110px 10px 10px'}}>
                    <div className="absolute top-0 right-0 w-[117px] h-[111px] opacity-[0.08]"><svg viewBox="0 0 117 111" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-full"><path d="M117 0H0C0 61.3 52.7 111 117 111V0Z" fill="white"/></svg></div>
                    <h3 className="text-[32px] font-normal text-white leading-[32px] pb-2.5">Mijn acties</h3>
                    <div className="pt-[30px] space-y-4">
                        {actions.map((a,i)=><button key={i} onClick={a.onClick} className="w-full flex items-center gap-[25px] pl-2.5 text-white hover:opacity-80 transition-opacity text-left">
                            <span className="w-8 h-8 rounded-full border border-white/40 flex items-center justify-center flex-shrink-0">{a.icon}</span>
                            <span className="text-[18px] font-semibold leading-[18px]">{a.label}</span>
                        </button>)}
                    </div>
                    {email&&<div className="pt-[60px] flex items-center gap-[15px] pl-[17px]">
                        <span className="flex-shrink-0 text-white">{I.mail("w-[25px] h-[27px]")}</span>
                        <span className="text-[18px] font-semibold text-white leading-[18px]">{email}</span>
                    </div>}
                </div>
            </div>;
        }

        /* ===== TOGGLE (visual-only for Figma table) ===== */
        function Toggle({on}){return<div className="flex items-center gap-2"><div className={`w-10 h-5 rounded-full relative ${on?'bg-yim-green':'bg-gray-300'}`}><div className={`absolute top-0.5 w-4 h-4 rounded-full bg-white shadow transition-all ${on?'left-[22px]':'left-0.5'}`}/></div><span className={`text-[10px] font-bold uppercase tracking-wider ${on?'text-yim-green':'text-gray-400'}`}>{on?'ACTIEF':'INACTIEF'}</span></div>;}

        /* ===== BLOCK MODAL (Figma: direct confirm popup, no reason step) ===== */
        function BlockModal({isOpen,onClose,onBlock,type,target,data}){
            if(!isOpen||!target)return null;
            const nm=type==='company'?target.naam:pName(target);
            const goConfirm=()=>{if(type==='company')onBlock({type:'company',bedrijfsnaam:target.naam,kvkNummer:target.kvkNummer,companyId:target.id,reden:'Toegevoegd via beheer blacklist.'});else{const co=coById(data.companies,target.bedrijfId);onBlock({type:'person',persoonNaam:pName(target),persoonId:target.id,bedrijfsnaam:co?co.naam:'-',kvkNummer:co?co.kvkNummer:'',reden:'Toegevoegd via beheer blacklist.'});}onClose();};
            return<FigmaPopup isOpen onClose={onClose} onOk={goConfirm} title="Toevoegen aan blacklist" msg={`Weet je zeker dat je ${nm} aan de blacklist wilt toevoegen? Alle toegangen worden ingetrokken.`} label="Toevoegen" danger/>;
        }

        /* ===== UNBLOCK MODAL (Figma: Verwijderen van blacklist) ===== */
        function UnblockModal({isOpen,onClose,onUnblock,name}){
            return<FigmaPopup isOpen={isOpen} onClose={onClose} onOk={onUnblock} title="Verwijderen van blacklist" msg={<>Weet je zeker dat je {name} van de blacklist wilt halen?<br/>Bestaande autorisaties worden niet automatisch hersteld.<br/>Betrokkenen moeten opnieuw een aanvraag indienen.</>} label="Verwijderen" danger/>;
        }

        /* ===== CHIP (selected item pill with initials + name + remove) ===== */
        function Chip({label,initials,onRemove,icon}){return<span className="inline-flex items-center gap-2 bg-yim-600 rounded-full pl-2.5 pr-2.5 py-1.5">{icon&&<span className="text-white flex-shrink-0">{icon}</span>}{initials&&<span className="w-6 h-6 rounded-full bg-white/20 text-white text-[10px] font-bold flex items-center justify-center flex-shrink-0">{initials}</span>}<span className="text-sm font-semibold text-white">{label}</span><button onClick={onRemove} className="text-white/60 hover:text-white ml-1">{I.x("w-3.5 h-3.5")}</button></span>;}

        /* ===== SEARCH DROPDOWN (reusable typeahead with keyboard nav, click-outside, highlight) ===== */
        function SearchDropdown({query,items,totalCount,onSelect,onClose,renderItem,placeholder,minChars=2,maxShow=10}){
            const[hlIdx,setHlIdx]=useState(-1);
            const wrapRef=useRef(null);
            const listRef=useRef(null);
            useClickOutside(wrapRef,onClose);
            useEffect(()=>{setHlIdx(-1);},[query]);
            const onKey=useCallback(e=>{
                if(!items.length)return;
                if(e.key==='ArrowDown'){e.preventDefault();setHlIdx(p=>Math.min(p+1,items.length-1));}
                else if(e.key==='ArrowUp'){e.preventDefault();setHlIdx(p=>Math.max(p-1,0));}
                else if(e.key==='Enter'&&hlIdx>=0){e.preventDefault();onSelect(items[hlIdx]);}
                else if(e.key==='Escape'){e.preventDefault();onClose();}
            },[items,hlIdx,onSelect,onClose]);
            useEffect(()=>{if(hlIdx>=0&&listRef.current){const el=listRef.current.children[hlIdx];if(el)el.scrollIntoView({block:'nearest'});}},[hlIdx]);
            const highlight=(text,q)=>{if(!q||q.length<minChars)return text;const i=text.toLowerCase().indexOf(q.toLowerCase());if(i===-1)return text;return<>{text.slice(0,i)}<mark className="bg-yim-200/60 text-yim-700 rounded px-0.5">{text.slice(i,i+q.length)}</mark>{text.slice(i+q.length)}</>;};
            const showResults=query.length>=minChars;
            return<div ref={wrapRef} className="relative">
                {showResults&&<div className="absolute z-20 mt-1 w-full max-w-xs border border-yim-200 rounded-lg bg-white shadow-lg overflow-hidden">
                    {items.length===0?<div className="px-4 py-3 text-sm text-yim-400 italic">Geen resultaten gevonden</div>:
                    <><div ref={listRef} className="max-h-[240px] overflow-y-auto">{items.map((item,i)=><button key={item.id||i} onClick={()=>onSelect(item)} onMouseEnter={()=>setHlIdx(i)} className={`w-full text-left px-4 py-2.5 text-sm border-b border-yim-100 last:border-0 transition-colors ${i===hlIdx?'bg-yim-100':'hover:bg-yim-50'}`}>{renderItem(item,q=>highlight(q,query))}</button>)}</div>
                    {totalCount>maxShow&&<div className="px-4 py-2 bg-yim-50 border-t border-yim-200 text-xs text-yim-400">{maxShow} van {totalCount} resultaten getoond</div>}</>}
                </div>}
            </div>;
        }

        /* ===== COMPANY SEARCH MODAL (Figma: split-screen modal) ===== */
        function CompanySearchModal({isOpen,onClose,onSelect,companies}){
            const[q,setQ]=useState('');const[searched,setSearched]=useState(false);const[sel,setSel]=useState(null);const[page,setPage]=useState(0);const PP=6;
            useEffect(()=>{if(isOpen){setQ('');setSearched(false);setSel(null);setPage(0);}},[isOpen]);
            if(!isOpen)return null;
            const filtered=searched&&q.length>=1?companies.filter(c=>{const s=q.toLowerCase();return c.naam.toLowerCase().includes(s)||c.kvkNummer.includes(s);}):companies;
            const totalPages=Math.ceil(filtered.length/PP);const paged=filtered.slice(page*PP,(page+1)*PP);
            const doSearch=()=>{setSearched(true);setPage(0);setSel(null);};
            return<div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40" onClick={onClose}><div className="bg-white rounded-xl shadow-2xl max-w-4xl w-full mx-4 fade-in max-h-[80vh] flex flex-col overflow-hidden" onClick={e=>e.stopPropagation()}>
                <div className="flex flex-1 min-h-0">
                    {/* Left panel */}
                    <div className="w-[45%] bg-yim-700 flex flex-col p-6 overflow-hidden">
                        <h2 className="text-2xl font-bold text-white mb-4">Bedrijf zoeken</h2>
                        <div className="flex gap-2 mb-4"><input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')doSearch();}} placeholder="Zoek op naam of KvK..." className="flex-1 px-4 py-2.5 rounded-md text-sm bg-white outline-none"/><button onClick={doSearch} className="px-5 py-2.5 bg-yim-500 text-white text-sm font-semibold rounded-md hover:bg-yim-400">Zoeken</button></div>
                        <div className="flex-1 overflow-y-auto space-y-0 -mx-2">
                            {paged.map(c=><button key={c.id} onClick={()=>setSel(c)} className={`w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 transition-colors ${sel?.id===c.id?'bg-white/20':'hover:bg-white/10'}`}>
                                <span className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${sel?.id===c.id?'border-yim-green bg-yim-green':'border-white/40'}`}>{sel?.id===c.id&&<svg className="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7"/></svg>}</span>
                                <div><p className="text-sm font-semibold text-white">{c.naam}</p><p className="text-xs text-yim-300">{c.kvkNummer}</p></div>
                            </button>)}
                            {paged.length===0&&<p className="text-sm text-white/60 px-4 py-3 italic">Geen resultaten</p>}
                        </div>
                        {totalPages>1&&<div className="flex items-center gap-2 pt-3 mt-2 border-t border-white/20">
                            {Array.from({length:Math.min(totalPages,3)},(_,i)=><button key={i} onClick={()=>setPage(i)} className={`w-8 h-8 rounded-md text-sm font-bold ${page===i?'bg-yim-500 text-white':'bg-white/20 text-white hover:bg-white/30'}`}>{i+1}</button>)}
                            {page<totalPages-1&&<button onClick={()=>setPage(p=>p+1)} className="px-3 py-1.5 text-sm font-semibold text-white border border-white/40 rounded-md hover:bg-white/10">Volgende</button>}
                        </div>}
                    </div>
                    {/* Right panel */}
                    <div className="w-[55%] flex flex-col p-6 relative">
                        <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 rounded-full border border-yim-300 flex items-center justify-center text-yim-400 hover:text-yim-700">{I.x("w-4 h-4")}</button>
                        <p className="text-yim-500 text-center font-semibold mb-4">Selectie</p>
                        {sel?<div className="border border-yim-200 rounded-lg overflow-hidden">

        function BLOverzicht({data,setData,onShowAdd,onShowPerson,onShowCompany}){

        /* ===== BEDRIJFSDOSSIER TAB (YIM Figma style + Mijn acties sidebar) ===== */
        function BedrijfTab({data,setData,initialSelId,onInitialSelConsumed}){
            const toast=useToast();const[sel,setSel]=useState(()=>{if(initialSelId){const c=data.companies.find(x=>x.id===initialSelId);if(c)return c;}return null;});const[showBlock,setShowBlock]=useState(false);const[showUnblock,setShowUnblock]=useState(false);

            const[coSearch,setCoSearch]=useState('');const[coPage,setCoPage]=useState(0);const PER_PAGE=20;

            const pagedCo=filteredCo.slice(coPage*PER_PAGE,(coPage+1)*PER_PAGE);const totalPages=Math.ceil(filteredCo.length/PER_PAGE);
            const doBlock=(fd)=>{const t=now(),id=genId('bl');setData(p=>{const e={id,type:'company',bedrijfsnaam:fd.bedrijfsnaam,kvkNummer:fd.kvkNummer,reden:fd.reden,toegevoegdOp:t,toegevoegdDoor:'Admin Hoofdtenant',status:'active'};let a=p.authorizations;if(fd.companyId)a=p.authorizations.map(x=>x.bedrijfId===fd.companyId&&x.status==='active'?{...x,einddatum:fmt(t),status:'revoked'}:x);const n=p.tenants.filter(x=>!x.isMain).map(x=>({id:genId('notif'),type:'blacklist_added',tenantId:x.id,blacklistId:id,bedrijfsnaam:fd.bedrijfsnaam,gegenereerd:t,verzonden:true}));return{...p,blacklist:[...p.blacklist,e],authorizations:a,notifications:[...p.notifications,...n]};});toast('Bedrijf toegevoegd aan blacklist','success');};
            const doUnblock=()=>{if(!blE)return;setData(p=>({...p,blacklist:p.blacklist.map(b=>b.id===blE.id?{...b,status:'removed'}:b)}));setShowUnblock(false);toast('Bedrijf verwijderd van blacklist','success');};

                        <div className="flex items-center justify-between h-16">
                            <div className="flex items-center gap-3"><div className="text-yim-500 font-bold text-2xl tracking-tight">YIM</div><span className="text-xs text-yim-400 border-l border-yim-300 pl-3">Blacklist Beheer</span></div>
                            <div className="flex items-center gap-2"><span className="text-sm font-bold text-yim-700">C. Schumacher van der Wal</span><button onClick={reset} className="ml-4 px-3 py-1.5 text-xs text-yim-400 border border-yim-300 rounded-md hover:bg-yim-50">Reset data</button></div>
                        </div>
                    </div>
                    <div className="h-[3px] bg-gradient-to-r from-yim-500 via-yim-200 to-transparent"/>
                    <div className="max-w-7xl mx-auto px-6">
                        <nav className="flex gap-0 border-b border-yim-300 -mb-px">{tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={`flex items-center gap-2 px-10 py-3 text-base font-semibold border-b-[3px] whitespace-nowrap transition-colors ${tab===t.id?'border-yim-500 text-yim-600 bg-yim-50':'border-transparent text-yim-500 hover:text-yim-600'}`}>{t.icon("w-4 h-4")}{t.label}</button>)}</nav>
                    </div>
                </header>
                <main className="max-w-7xl mx-auto px-6 py-10 flex-1 w-full">{tab==='blacklist'&&<BLOverzicht data={data} setData={setData} onShowAdd={()=>setShowAddBl(true)} onShowPerson={goToPerson} onShowCompany={goToCompany}/>}{tab==='bedrijf'&&<BedrijfTab data={data} setData={setData} initialSelId={preSelCompany} onInitialSelConsumed={()=>setPreSelCompany(null)}/>}{tab==='persoon'&&<PersoonTab data={data} setData={setData} initialSelId={preSelPerson} onInitialSelConsumed={()=>setPreSelPerson(null)}/>}{tab==='notificaties'&&<NotifTab data={data}/>}</main>
                <footer className="bg-yim-600 text-white py-6 px-6"><div className="max-w-7xl mx-auto"><p className="text-base">&copy; Copyright 2026 - YIM - Your Identity Management</p></div></footer>
            </div>;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<ToastWrap><App/></ToastWrap>);
    </script>
</body>
</html>
