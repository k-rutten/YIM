                                </button>
                                <div>
                                    <h2 className="text-lg font-semibold text-yim-600">
                                        {isNewRole ? 'Nieuwe rol aanmaken' : editForm.name || 'Rol bewerken'}
                                    </h2>
                                    <p className="text-sm text-yim-600 opacity-60">
                                        {concept === 'A'
                                            ? `Profiel: ${linkedProfile?.name || 'Geen profiel gekoppeld'}`
                                            : concept === 'C'
                                            ? (() => {
                                                const lvlName = SENSITIVITY_LEVELS.find(l => l.level === editForm.sensitivityLevel)?.name || '?';
                                                const exCount = Object.values(editForm.exceptions || {}).reduce((sum, obj) => sum + Object.keys(obj || {}).length, 0);
                                                const sugLvl = suggestSensitivityLevel(editForm.roleSettings || createDefaultRoleSettings()).level;
                                                const suffix = exCount > 0 ? ` · ${exCount} uitzondering${exCount !== 1 ? 'en' : ''}` : sugLvl === editForm.sensitivityLevel ? ' · Voorgesteld' : '';
                                                return `Niveau: ${lvlName} · ${totalCatCount}/${totalCatMax} categorieën${suffix}`;
                                            })()
                                            : `${totalCatCount}/${totalCatMax} categorieën`
                                        }
                                    </p>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                {!isNewRole && (
                                    <button onClick={() => setDeleteConfirm(selectedRole)} className="px-4 py-2 text-sm text-yim-red hover:bg-yim-red/10 rounded-lg transition-colors">Verwijderen</button>
                                )}
                                <button onClick={closeRoleEditor} className="px-4 py-2 text-sm text-yim-600 hover:bg-yim-100 rounded-lg transition-colors">Annuleren</button>
                                <button onClick={saveRole} disabled={!editForm.name} className="px-5 py-2 bg-yim-500 text-white text-sm font-medium rounded-lg hover:bg-yim-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                    {isNewRole ? 'Rol aanmaken' : 'Opslaan'}
                                </button>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6">
                            <div className="max-w-4xl mx-auto space-y-6">
                                {/* Section 1: Informatie (matching Figma) */}
                                <div className="bg-white rounded-lg border border-yim-200 overflow-hidden">
                                    <div className="px-12 py-5">
                                        <h3 className="text-[30px] font-bold text-yim-700" style={{ fontFamily: 'Nunito, sans-serif' }}>Informatie</h3>
                                    </div>
                                    <div className="bg-[#f0f5f7]">
                                        <div className="grid items-center p-4" style={{ gridTemplateColumns: '240px 1fr' }}>
                                            <label className="text-base font-semibold text-yim-700 pr-5 py-2">Naam</label>
                                            <input type="text" value={editForm.name || ''} onChange={(e) => setEditForm(prev => ({ ...prev, name: e.target.value }))} className="px-3 py-2.5 border border-yim-300 rounded bg-white text-sm focus:ring-2 focus:ring-yim-500 focus:border-yim-500" style={{ width: 320 }} placeholder="Bijv. Project Manager" />
                                        </div>
                                    </div>
                                    <div className="border-t border-yim-200">
                                        <div className="grid items-center p-4" style={{ gridTemplateColumns: '240px 1fr' }}>
                                            <label className="text-base font-semibold text-yim-700 pr-5 py-2">Omschrijving</label>
                                            <input type="text" value={editForm.description || ''} onChange={(e) => setEditForm(prev => ({ ...prev, description: e.target.value }))} className="px-3 py-2.5 border border-yim-300 rounded bg-white text-sm focus:ring-2 focus:ring-yim-500 focus:border-yim-500" style={{ width: 320 }} placeholder="Korte beschrijving van de rol" />
                                        </div>
                                    </div>
                                </div>

                                {/* ===== SHARED: Role Settings Panel ===== */}
                                <RoleSettingsPanel
                                    roleSettings={editForm.roleSettings || createDefaultRoleSettings()}
                                    onChange={(newSettings) => {
                                        if (concept === 'C') {
                                            const { level, _justifications } = suggestSensitivityLevel(newSettings);
                                            const newCats = getCategoriesForLevel(level, {});
                                            setEditForm(prev => ({
                                                ...prev, roleSettings: newSettings,
                                                sensitivityLevel: level, exceptions: {},
                                                ...newCats, _justifications
                                            }));
                                        } else if (concept === 'G') {
                                            const { allowedCategories: derived, _justifications9 } = deriveTo9Categories(newSettings);
                                            setEditForm(prev => {
                                                const overrides = { ...(prev._overrides || {}) };
                                                Object.keys(overrides).forEach(k => { if (overrides[k] === derived[k]) delete overrides[k]; });
                                                const final = { ...derived };
                                                Object.entries(overrides).forEach(([k, v]) => { final[k] = v; });
                                                return { ...prev, roleSettings: newSettings,
                                                    allowedCategories: final, _derivedCategories: derived, _justifications9, _overrides: overrides };
                                            });
                                        } else {
                                            setEditForm(prev => ({ ...prev, roleSettings: newSettings }));
                                        }
                                    }}
                                />

                                {/* ===== Data-inzage scheidingslijn (niet voor Concept E — harde grenzen) ===== */}
                                {concept !== 'E' && concept !== 'F' && concept !== 'G' && (
                                <div className="flex items-center gap-3 mt-2">
                                    <div className="flex-1 border-t border-yim-300"></div>
                                    <span className="text-xs font-bold text-yim-500 uppercase tracking-wider">Data-inzage</span>
                                    <div className="flex-1 border-t border-yim-300"></div>
                                </div>
                                )}

                                {/* ===== CONCEPT G: Afgeleide data-inzage panel ===== */}
                                {concept === 'G' && (() => {
                                    // Live-derive uit huidige roleSettings
                                    const liveDerived = deriveTo9Categories(editForm.roleSettings || createDefaultRoleSettings());
                                    const derivedCats = liveDerived.allowedCategories;
                                    const justifications = liveDerived._justifications9 || {};
                                    const overrides = editForm._overrides || {};
                                    const fieldOverrides = editForm._fieldOverrides || {};
                                    const overrideCount = Object.keys(overrides).length;
                                    const fieldOverrideCount = Object.values(fieldOverrides).reduce((sum, o) => sum + Object.keys(o || {}).length, 0);
                                    const derivedCount = Object.values(derivedCats).filter(Boolean).length;

                                    const toggleOverride = (catId) => {
                                        setEditForm(prev => {
                                            const derived = deriveTo9Categories(prev.roleSettings || createDefaultRoleSettings()).allowedCategories;
                                            const ov = { ...(prev._overrides || {}) };
                                            if (ov[catId] !== undefined) {
                                                delete ov[catId];
                                            } else {
                                                ov[catId] = !derived[catId];
                                            }
                                            const final = { ...derived };
                                            Object.entries(ov).forEach(([k, v]) => { final[k] = v; });
                                            // Clear field overrides voor categorieën die nu uit zijn
                                            const fo = { ...(prev._fieldOverrides || {}) };
                                            Object.keys(fo).forEach(catK => { if (!final[catK]) delete fo[catK]; });
                                            return { ...prev, allowedCategories: final, _overrides: ov, _fieldOverrides: fo };
                                        });
                                    };

                                    const toggleField = (catId, fieldId) => {
                                        setEditForm(prev => {
                                            const liveD = deriveTo9Categories(prev.roleSettings || createDefaultRoleSettings()).allowedCategories;
                                            const ov = prev._overrides || {};
                                            const wasActive = ov[catId] !== undefined ? !!ov[catId] : !!liveD[catId];
                                            const catDef = CATEGORIES.find(c => c.id === catId);

                                            // Categorie uit + klik op chip → activeer + alleen dit veld zichtbaar (rest via override op false)
                                            if (!wasActive) {
                                                const newOv = { ...ov, [catId]: true };
                                                const finalCats = { ...liveD };
                                                Object.entries(newOv).forEach(([k, v]) => { finalCats[k] = v; });

                                                    Object.entries(baseline[fk] || {}).forEach(([id, baseVal]) => {
                                                        if (desired[id] !== undefined && desired[id] !== baseVal) {
                                                            if (!newExceptions[fk]) newExceptions[fk] = {};
                                                            newExceptions[fk][id] = desired[id];
                                                        }
                                                    });
                                                });
                                                const newCats = getCategoriesForLevel(neededLevel, newExceptions);
                                                return { ...prev, sensitivityLevel: neededLevel, exceptions: newExceptions, ...newCats };
                                            } else {
                                                // Slider stays: just toggle this category as exception
                                                const newLevelDefault = catLevel <= curLevel;
                                                const newExceptions = { ...prev.exceptions };
                                                if (!newExceptions[group.formKey]) newExceptions[group.formKey] = {};
                                                if (newVal === newLevelDefault) {
                                                    delete newExceptions[group.formKey][item.id];
                                                    if (Object.keys(newExceptions[group.formKey]).length === 0) delete newExceptions[group.formKey];
                                                } else {
                                                    newExceptions[group.formKey][item.id] = newVal;
                                                }
                                                return { ...prev, exceptions: newExceptions, [group.formKey]: { ...prev[group.formKey], [item.id]: newVal } };
                                            }
                                        });
                                    };

                                    // V3: Handle group-level toggle (toggles all subcategories in a group)
                                    const handleGroupToggle = (group) => {
                                        const allActive = group.subcatIds.every(id => isSubcatActive(id));
                                        const newVal = !allActive;
                                        setEditForm(prev => {
                                            const curLevel = prev.sensitivityLevel || 1;
                                            const desired = {};
                                            ['categories', 'dossierCategories', 'certCategories', 'fileCategories'].forEach(key => {
                                                Object.entries(prev[key] || {}).forEach(([id, v]) => { desired[id] = v; });
                                            });
                                            group.subcatIds.forEach(id => { desired[id] = newVal; });

                                            const hierarchyIds = new Set(ALL_SUBCATEGORIES.map(s => s.id));
                                            let neededLevel = 1;
                                            Object.entries(desired).forEach(([id, active]) => {
                                                if (active && hierarchyIds.has(id) && CATEGORY_MIN_LEVEL[id]) neededLevel = Math.max(neededLevel, CATEGORY_MIN_LEVEL[id]);
                                            });

                                            if (neededLevel !== curLevel) {
                                                const baseline = getCategoriesForLevel(neededLevel);
                                                const newExceptions = {};
                                                ['categories', 'dossierCategories', 'certCategories', 'fileCategories'].forEach(fk => {
                                                    Object.entries(baseline[fk] || {}).forEach(([id, baseVal]) => {
                                                        if (desired[id] !== undefined && desired[id] !== baseVal) {
                                                            if (!newExceptions[fk]) newExceptions[fk] = {};
                                                            newExceptions[fk][id] = desired[id];
                                                        }
                                                    });
                                                });
                                                const newCats = getCategoriesForLevel(neededLevel, newExceptions);
                                                return { ...prev, sensitivityLevel: neededLevel, exceptions: newExceptions, ...newCats };
                                            } else {
                                                const newExceptions = { ...prev.exceptions };
                                                const updates = {};
                                                group.subcatIds.forEach(id => {
                                                    const fk = getFormKeyForSubcat(id);
                                                    const catLevel = CATEGORY_MIN_LEVEL[id] || 1;
                                                    const defaultVal = catLevel <= curLevel;
                                                    if (!updates[fk]) updates[fk] = { ...prev[fk] };
                                                    updates[fk][id] = newVal;
                                                    if (!newExceptions[fk]) newExceptions[fk] = {};
                                                    if (newVal === defaultVal) {
                                                        delete newExceptions[fk][id];
                                                        if (Object.keys(newExceptions[fk]).length === 0) delete newExceptions[fk];
                                                    } else {
                                                        newExceptions[fk][id] = newVal;
                                                    }
                                                });
                                                return { ...prev, exceptions: newExceptions, ...updates };
                                            }
                                        });
                                    };

                                    // Count categories per level (using hierarchy subcategories only)
                                    const catsPerLevel = (() => {
                                        const counts = { 1: 0, 2: 0, 3: 0, 4: 0 };
                                        ALL_SUBCATEGORIES.forEach(s => {
                                            const lvl = CATEGORY_MIN_LEVEL[s.id];
                                            if (lvl) counts[lvl] = (counts[lvl] || 0) + 1;
                                        });
                                        return counts;
                                    })();

                                    // Render checkbox rows for a category group (legacy, used by old views)
                                    const renderCheckboxRows = (group) => {
                                        const justKey = group.formKey === 'categories' ? 'categories' : group.formKey === 'dossierCategories' ? 'dossier' : group.formKey === 'certCategories' ? 'certs' : 'files';
                                        const justifications = editForm._justifications?.[justKey] || {};
                                        return group.items.map((item, idx) => {
                                            const isActive = !!editForm[group.formKey]?.[item.id];
                                            const levelDefault = CATEGORY_MIN_LEVEL[item.id] <= (editForm.sensitivityLevel || 1);
                                            const isException = levelDefault !== isActive;
                                            const sens = group.getSensitivity(item);
                                            const isEven = idx % 2 === 0;
                                            const reasons = justifications[item.id] || [];
                                            return (
                                                <div key={item.id}
                                                    onClick={() => handleCategoryToggle(group, item, isActive)}

                                                    <div className="flex items-center gap-2 min-w-0">
                                                        <div className={`w-[18px] h-[18px] rounded-[4px] flex-shrink-0 flex items-center justify-center transition-all ${
                                                            isActive
                                                                ? isException ? 'bg-green-500' : 'bg-[#6daeba]'

                                                        }`}>

                                                        </div>
                                                        <span className="text-[13px] text-[#265263] truncate">{item.name}</span>
                                                        {sens && <span className={`text-[9px] px-1 py-px rounded flex-shrink-0 ${sens === 'red' ? 'text-red-600 bg-red-50' : 'text-orange-600 bg-orange-50'}`}>{sens === 'red' ? 'zeer gevoelig' : 'gevoelig'}</span>}
                                                    </div>
                                                    <div className="flex items-center gap-1.5 flex-shrink-0 ml-2">
                                                        {isException && (
                                                            <span className={`text-[9px] font-medium px-1 py-px rounded ${isActive ? 'text-green-700 bg-green-50' : 'text-red-600 bg-red-50'}`}>
                                                                {isActive ? '+' : '−'}
                                                            </span>
                                                        )}
                                                        {isActive && reasons.length > 0 && (
                                                            <span className="relative group/tip">
                                                                <svg className="w-3 h-3 text-purple-400 cursor-help" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                                                <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 hidden group-hover/tip:block z-10">
                                                                    <div className="bg-yim-700 text-white text-xs rounded-lg px-3 py-2 shadow-lg whitespace-nowrap">
                                                                        <p className="font-medium mb-1 text-white/70">Voorgesteld door:</p>
                                                                        {reasons.slice(0, 5).map((r, i) => <p key={i} className="text-white/90">• {r}</p>)}
                                                                        <div className="absolute top-full left-1/2 -translate-x-1/2 -mt-px"><div className="border-4 border-transparent border-t-yim-700"></div></div>
                                                                    </div>
                                                                </div>
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        });
                                    };

                                    return (
                                    <>

                                                            <span className="text-sm font-medium text-[#265263]">{hoofdcat.label}</span>
                                                        </div>
                                                        <span className={`text-sm font-semibold ${activeGroupCount === totalGroupCount ? 'text-[#6daeba]' : 'text-yim-600'}`}>{activeGroupCount}/{totalGroupCount}</span>
                                                    </button>
                                                    {isGroupExpanded && (
                                                        <div className="px-8 pb-4 pt-1 space-y-3">
                                                            {groupsInCat.map(grp => {
                                                                const activeSubcats = grp.subcatIds.filter(id => isSubcatActive(id));
                                                                const allActive = activeSubcats.length === grp.subcatIds.length;
                                                                const someActive = activeSubcats.length > 0;
                                                                const maxLevel = Math.max(...grp.subcatIds.map(id => CATEGORY_MIN_LEVEL[id] || 1));

                                                                return (
                                                                    <div key={grp.id}>
                                                                        <button
                                                                            onClick={() => handleGroupToggle(grp)}
                                                                            className={`inline-flex items-center gap-2 py-1 rounded-[4px] text-[14px] font-semibold transition-all border ${
                                                                                allActive
                                                                                    ? 'bg-white text-[#3e3f40] border-[#6daeba] pl-1 pr-2'
                                                                                    : someActive
                                                                                        ? 'bg-white text-[#3e3f40] border-[#6daeba] border-dashed pl-1 pr-2'
                                                                                        : 'bg-white text-[#1d1e1f] border-[#999a9b] px-2 hover:border-[#6daeba]'
                                                                            }`}
                                                                            style={{ fontFamily: 'Nunito, sans-serif', letterSpacing: '0.14px', lineHeight: '20px' }}>
                                                                            {(allActive || someActive) && (
                                                                                <svg className="w-[18px] h-[18px] text-[#6daeba]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d={allActive ? "M5 13l4 4L19 7" : "M5 12h14"} />
                                                                                </svg>
                                                                            )}
                                                                            <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: lvlColor }}></span>
                                                                            {grp.name}
                                                                        </button>
                                                                        <div className="mt-1 ml-1 flex flex-wrap gap-x-3 gap-y-0.5">
                                                                            {grp.subcatIds.map(subcatId => {
                                                                                const subcat = SUBCAT_BY_ID[subcatId];
                                                                                const isActive = isSubcatActive(subcatId);
                                                                                const level = CATEGORY_MIN_LEVEL[subcatId] || 1;
                                                                                const sColor = SENSITIVITY_LEVELS.find(l => l.level === level)?.color || '#9CA3AF';
                                                                                return (
                                                                                    <span key={subcatId} className={`inline-flex items-center gap-1.5 text-[12px] ${isActive ? 'text-[#3e3f40]' : 'text-[#999a9b]'}`} style={{ fontFamily: 'Nunito, sans-serif' }}>
                                                                                        <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{ backgroundColor: sColor, opacity: isActive ? 1 : 0.4 }}></span>
                                                                                        {subcat?.name || subcatId}
                                                                                    </span>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}

                                        {/* Tijdelijk onthullen */}
                                        <div className="border-t border-yim-200 bg-[#f0f5f7]">
                                            <div className="px-5 py-3 flex items-center justify-between">
                                                <div>
                                                    <label className="text-sm font-semibold text-yim-700" style={{ fontFamily: 'Nunito, sans-serif' }}>Tijdelijk onthullen</label>
                                                    {editForm.canReveal && <p className="text-xs text-yim-600 opacity-50 mt-0.5">Mag gemaskeerde velden tijdelijk (5 sec) bekijken</p>}
                                                </div>
                                                <button onClick={() => setEditForm(prev => ({ ...prev, canReveal: !prev.canReveal }))}
                                                    className={`relative w-12 h-7 rounded-full transition-all ${editForm.canReveal ? 'bg-[#6daeba]' : 'bg-gray-300'}`}>
                                                    <div className={`absolute top-0.5 w-6 h-6 rounded-full bg-white shadow transition-all ${editForm.canReveal ? 'left-[22px]' : 'left-0.5'}`}></div>
                                                </button>
                                            </div>
                                        </div>

                                        {/* Dossier bewerken */}
                                        <div className="border-t border-yim-200 bg-blue-50/30">
                                            <div className="px-5 py-3 flex items-center justify-between">

                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    </>
                                    );
                                })()}

                                {/* Concept D removed — functionality merged into Concept C */}

                                {concept === 'A' && (

                                        <label className="block text-xs font-medium text-yim-600 opacity-60 mb-1.5 uppercase tracking-wide">Gekoppeld profiel</label>
                                        <select
                                            value={editForm.visibilityProfileId || ''}

                                            {visibilityProfiles.map(p => (
                                                <option key={p.id} value={p.id}>{p.name} — {p.description}</option>

                                        {linkedProfile && (
                                            <div className="mt-4 p-4 bg-yim-50 rounded-lg border border-yim-200">

                                                        <th className="px-6 py-3 text-left text-sm font-normal text-white">Beschrijving</th>
                                                        <th className="px-6 py-3 text-left text-sm font-normal text-white">
                                                            {concept === 'A' ? 'Profiel' : concept === 'C' ? 'Inzageniveau' : concept === 'G' ? 'Afgeleide inzage' : 'Inzageprofiel'}
                                                        </th>
                                                        <th className="px-6 py-3 text-left text-sm font-normal text-white">Onthullen</th>
                                                        <th className="px-6 py-3 text-right text-sm font-normal text-white"></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {Object.entries(roles).map(([key, roleData]) => {
                                                        const rp = concept === 'A' ? getProfileForRole(roleData) : null;
                                                        const roleTotalCat = concept === 'G'
                                                            ? Object.values(roleData.allowedCategories || {}).filter(Boolean).length
                                                            : concept === 'C'
                                                            ? (Object.values(roleData.categories || {}).filter(Boolean).length + Object.values(roleData.dossierCategories || {}).filter(Boolean).length + Object.values(roleData.certCategories || {}).filter(Boolean).length + Object.values(roleData.fileCategories || {}).filter(Boolean).length)
                                                            : 0;
                                                        const roleTotalMax = concept === 'G' ? ALL_CATEGORY_IDS.length : (dataGroups.length + dossierComponents.length + certificateCategories.length + fileCategories.length);
                                                        const roleCanReveal = concept === 'A' ? rp?.canReveal : roleData.canReveal;
                                                        return (
                                                            <tr key={key} className="border-t border-yim-200 hover:bg-yim-50 cursor-pointer transition-colors" onClick={() => openRoleEditor(key)}>
                                                                <td className="px-6 py-4"><div className="font-bold text-yim-600">{roleData.name}</div></td>
                                                                <td className="px-6 py-4"><div className="text-sm text-yim-600">{roleData.description}</div></td>
                                                                <td className="px-6 py-4">
                                                                    {concept === 'A' ? (
                                                                        <span className="inline-flex items-center text-xs text-yim-500 bg-yim-50 px-2 py-1 rounded border border-yim-200">
                                                                            {rp?.name || 'Geen'}
                                                                        </span>
                                                                    ) : concept === 'C' ? (() => {
                                                                        const lvl = SENSITIVITY_LEVELS.find(l => l.level === roleData.sensitivityLevel);
                                                                        const exCount = Object.values(roleData.exceptions || {}).reduce((sum, obj) => sum + Object.keys(obj || {}).length, 0);
                                                                        return (
                                                                            <div className="flex flex-wrap items-center gap-1.5">
                                                                                <span className="inline-flex items-center text-xs font-medium px-2 py-1 rounded border" style={{color: lvl?.color, borderColor: lvl?.color + '40', backgroundColor: lvl?.color + '10'}}>{lvl?.name}</span>
                                                                                <span className="text-xs text-yim-400">·</span>
                                                                                <span className="text-xs text-yim-500">{roleTotalCat}/{roleTotalMax}</span>
                                                                                {exCount > 0 && <><span className="text-xs text-yim-400">·</span><span className="text-xs text-yim-orange">{exCount}x uitzondering</span></>}
                                                                            </div>
                                                                        );
                                                                    })() : (() => {
                                                                        const rowPreset = matchPreset(roleData);
                                                                        return (
                                                                            <div className="flex flex-wrap items-center gap-1.5">
                                                                                <span className="inline-flex items-center text-xs font-medium px-2 py-1 rounded border text-yim-600 bg-yim-50 border-yim-200">
                                                                                    {rowPreset ? rowPreset.name : 'Aangepast'}
                                                                                </span>
                                                                                <span className="text-xs text-yim-400">·</span>
                                                                                <span className="text-xs text-yim-500">{roleTotalCat}/{roleTotalMax}</span>
                                                                            </div>
                                                                        );
                                                                    })()}
                                                                </td>
                                                                <td className="px-6 py-4">
                                                                    {roleCanReveal ? (
                                                                        <span className="inline-flex items-center gap-1 text-xs text-yim-green bg-yim-green/10 px-2 py-1 rounded">
                                                                            <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
                                                                            Ja
                                                                        </span>
                                                                    ) : (
                                                                        <span className="inline-flex items-center text-xs text-yim-600 opacity-60 bg-yim-100 px-2 py-1 rounded">Nee</span>
                                                                    )}
                                                                </td>
                                                                <td className="px-6 py-4 text-right">
                                                                    <RowActionMenu
                                                                        itemKey={`role-${key}`}
                                                                        openMenuKey={openMenuKey}
                                                                        setOpenMenuKey={setOpenMenuKey}
                                                                        onEdit={() => openRoleEditor(key)}
                                                                        onDuplicate={() => handleDuplicateRole(key)}
                                                                    />
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </>
                                )}

                                {/* ===== PROFILES VIEW ===== */}
                                {activeMenu === 'profiles' && (
                                    <>
                                        <div className="flex items-start gap-4 mb-8">
                                            <div className="w-4 h-8 bg-yim-200 rounded-full mt-2"></div>
                                            <div>
                                                <h1 className="text-4xl font-bold text-yim-600">Zichtbaarheidsprofielen</h1>
                                                <p className="text-base font-bold text-yim-600 mt-1">Beheer welke categorieën en scope per profiel zichtbaar zijn</p>
                                            </div>
                                        </div>
                                        <div className="bg-white rounded-lg border border-yim-200 overflow-hidden">
                                            <table className="w-full">
                                                <thead className="bg-yim-600">
                                                    <tr>
                                                        <th className="px-6 py-3 text-left text-sm font-normal text-white">Naam</th>
                                                        <th className="px-6 py-3 text-left text-sm font-normal text-white">Beschrijving</th>
                                                        <th className="px-6 py-3 text-left text-sm font-normal text-white">Categorieën</th>
                                                        <th className="px-6 py-3 text-left text-sm font-normal text-white">Onthullen</th>
                                                        <th className="px-6 py-3 text-left text-sm font-normal text-white">Rollen</th>
                                                        <th className="px-6 py-3 text-right text-sm font-normal text-white"></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {visibilityProfiles.map(profile => {
                                                        const linkedRoles = Object.entries(roles).filter(([_, r]) => r.visibilityProfileId === profile.id);
                                                        return (
                                                            <tr key={profile.id} className="border-t border-yim-200 hover:bg-yim-50 cursor-pointer transition-colors" onClick={() => openProfileEditor(profile.id)}>
                                                                <td className="px-6 py-4"><div className="font-bold text-yim-600">{profile.name}</div></td>
                                                                <td className="px-6 py-4"><div className="text-sm text-yim-600">{profile.description}</div></td>
                                                                <td className="px-6 py-4">
                                                                    <div className="text-sm text-yim-600">{Object.values(profile.allowedCategories || {}).filter(Boolean).length} / {ALL_CATEGORY_IDS.length}</div>
                                                                </td>
                                                                <td className="px-6 py-4">
                                                                    {profile.canReveal ? (
                                                                        <span className="inline-flex items-center gap-1 text-xs text-yim-green bg-yim-green/10 px-2 py-1 rounded">
                                                                            <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
                                                                            Ja
                                                                        </span>
                                                                    ) : (
                                                                        <span className="inline-flex items-center text-xs text-yim-600 opacity-60 bg-yim-100 px-2 py-1 rounded">Nee</span>
                                                                    )}
                                                                </td>
                                                                <td className="px-6 py-4">
                                                                    <div className="flex flex-wrap gap-1">
                                                                        {linkedRoles.map(([key, r]) => (
                                                                            <span key={key} className="text-xs bg-yim-100 text-yim-600 px-2 py-0.5 rounded">{r.name}</span>
                                                                        ))}
                                                                        {linkedRoles.length === 0 && <span className="text-xs text-yim-600 opacity-40">Geen</span>}
                                                                    </div>
                                                                </td>
                                                                <td className="px-6 py-4 text-right">
                                                                    <RowActionMenu
                                                                        itemKey={`profile-${profile.id}`}
                                                                        openMenuKey={openMenuKey}
                                                                        setOpenMenuKey={setOpenMenuKey}
                                                                        onEdit={() => openProfileEditor(profile.id)}
                                                                        onDuplicate={() => handleDuplicateProfile(profile.id)}
                                                                    />
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </>
                                )}

                                {/* Other menu items - placeholder */}
                                {activeMenu !== 'roles' && activeMenu !== 'profiles' && activeMenu !== 'groups' && (
                                    <div className="flex items-start gap-4 mb-8">
                                        <div className="w-4 h-8 bg-yim-200 rounded-full mt-2"></div>
                                        <div>
                                            <h1 className="text-4xl font-bold text-yim-600">{menuItems.find(m => m.id === activeMenu)?.label}</h1>
                                            <p className="text-base font-bold text-yim-600 mt-1 opacity-50">Binnenkort beschikbaar</p>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Mijn Acties Panel */}
                            <div className="w-72 flex-shrink-0">
                                <div className="bg-yim-700 rounded-bl-lg rounded-br-lg rounded-tl-lg rounded-tr-[110px] px-5 pt-12 pb-8 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-28 h-28 bg-yim-600/30 rounded-bl-full"></div>
                                    <h3 className="text-3xl font-normal text-white mb-8">Mijn acties</h3>

                                    {activeMenu === 'roles' && (
                                        <button onClick={openNewRoleEditor} className="flex items-center gap-4 text-white w-full py-3 hover:bg-white/10 rounded-lg transition-colors">
                                            <div className="w-8 h-8 flex items-center justify-center">
                                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 4v16m8-8H4" /></svg>
                                            </div>
                                            <span className="text-lg font-semibold">Nieuwe rol toevoegen</span>
                                        </button>
                                    )}

                                    {activeMenu === 'profiles' && concept === 'A' && (
                                        <button onClick={openNewProfileEditor} className="flex items-center gap-4 text-white w-full py-3 hover:bg-white/10 rounded-lg transition-colors">
                                            <div className="w-8 h-8 flex items-center justify-center">
                                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 4v16m8-8H4" /></svg>
                                            </div>
                                            <span className="text-lg font-semibold">Nieuw profiel toevoegen</span>
                                        </button>
                                    )}

                                    <div className="mt-16 flex items-center gap-4 text-white">
                                        <div className="w-8 h-8 flex items-center justify-center">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                            </svg>
                                        </div>
                                        <span className="text-lg font-semibold">yimsupport@nsecure.nl</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Root Component with state management + concept toggle
        function Root() {
            const [concept, setConcept] = useState('A');
            const [rolesA, setRolesA] = useState(initialRolesA);
            const [rolesC, setRolesC] = useState(initialRolesC);
            const [rolesG, setRolesG] = useState(initialRolesG);
            const [visibilityProfiles, setVisibilityProfiles] = useState(initialVisibilityProfiles);
            const [currentTab, setCurrentTab] = useState('viewer');

            const roles = concept === 'A' ? rolesA : concept === 'C' ? rolesC : rolesG;
            const setRoles = concept === 'A' ? setRolesA : concept === 'C' ? setRolesC : setRolesG;

            return (
                <div>
                    {/* Fixture Toggle */}
                    <div className="bg-yim-950 text-white">
                        <div className="max-w-6xl mx-auto px-6 py-2.5 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <span className="text-xs font-medium text-white/50 uppercase tracking-wider">Concept</span>
                                <div className="flex bg-white/10 rounded-lg p-0.5">
                                    <button onClick={() => setConcept('A')} className={`px-2.5 py-1.5 text-xs font-semibold rounded-md transition-all ${concept === 'A' ? 'bg-yim-orange text-white shadow-sm' : 'text-white/60 hover:text-white'}`}>
                                        1: Profielen
                                    </button>
                                    <button onClick={() => setConcept('G')} className={`px-2.5 py-1.5 text-xs font-semibold rounded-md transition-all ${concept === 'G' ? 'bg-teal-500 text-white shadow-sm' : 'text-white/60 hover:text-white'}`}>
                                        3: Taakafleiding
                                    </button>
                                </div>
                            </div>
                            <p className="text-xs text-white/40">
                                {concept === 'A' ? 'Profiel = bron van waarheid · Profielwijziging raakt alle gekoppelde rollen'
                                 : concept === 'C' ? 'Inzageniveau met suggestie · Categorieën volgen uit rolinstellingen'
                                 : concept === 'G' ? 'Categorieën afgeleid uit taken · Handmatige override met waarschuwing'
                                 : 'Categorieën per rol · Presets · Harde grenzen bij cross-company'}
                            </p>
                        </div>
                    </div>
                    <App roles={roles} setRoles={setRoles} visibilityProfiles={visibilityProfiles} setVisibilityProfiles={setVisibilityProfiles} currentTab={currentTab} setCurrentTab={setCurrentTab} concept={concept} setConcept={setConcept} />
                </div>
            );
        }

        ReactDOM.render(<Root />, document.getElementById('root'));
    </script>
</body>
</html>
