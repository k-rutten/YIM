            // Same visibility-engine als YIMDossierView
            const isFieldVisible = (fieldId) => {
                const def = FIELD_DEFS[fieldId];
                if (!def) return false;
                const effectiveCats = concept === 'A' ? profile?.allowedCategories : role.allowedCategories;
                if (!effectiveCats?.[def.categoryId]) return false;
                if (concept === 'G' && role._fieldOverrides && role._fieldOverrides[def.categoryId]) {
                    if (role._fieldOverrides[def.categoryId][fieldId] === false) return false;
                }
                return true;
            };
            const isFieldSensitive = (fieldId) => {
                const def = FIELD_DEFS[fieldId];
                if (!def) return false;
                return def.sensitivity === 'zeer_gevoelig' || def.categorySensitivity === 'zeer_gevoelig';
            };

            const handleReveal = (fieldId) => {
                setRevealedFields(prev => ({ ...prev, [fieldId]: true }));
                setAuditLog(prev => [...prev, {
                    timestamp: new Date().toISOString(),
                    role: role.name,
                    field: FIELD_DEFS[fieldId]?.name || fieldId,
                    action: 'reveal-edit'  // Onderscheid: reveal tijdens edit
                }]);
                setTimeout(() => {
                    setRevealedFields(prev => { const n = { ...prev }; delete n[fieldId]; return n; });
                }, 5000);
            };

            // Step structure (mirroring YIM screenshots)
            const STEPS = [
                {
                    number: 1, title: 'Inhuur- of Contractperiode',
                    description: 'De periode van de persoon die ingehuurd wordt of een contract heeft.',
                    sections: [
                        { title: 'Inhuur- of Contractperiode', fields: ['period_from', 'period_to'] }
                    ]
                },
                {
                    number: 2, title: 'Basis registratie',
                    description: 'Persoonsgegevens, werkgever en contactpersoon.',
                    sections: [
                        { title: 'Personalia', fields: ['first_name', 'initials', 'last_name_prefix', 'last_name', 'language', 'email', 'phone'] },
                        { title: 'Gegevens werkgever', fields: ['main_contractor', 'main_contractor_kvk', 'employer', 'employer_kvk', 'job_functions'] },
                        { title: 'Contactpersoon (werkgever)', fields: ['contact_person_name', 'contact_person_email', 'contact_person_phone'] },
                        { title: 'Verblijfplaats', fields: ['locality', 'country_of_residence'] }
                    ]
                },
                {
                    number: 3, title: 'Aanvullende gegevens',
                    description: 'Identificatie, kwalificaties en certificaten.',
                    sections: [
                        { title: 'Identificatie', fields: ['nationality', 'date_of_birth', 'id_type', 'id_document_number', 'id_expiration_date', 'bsn', 'vog'] },
                        { title: 'Compliance & Instructies', fields: ['vca_exemption', 'vca_exemption_reason', 'company_specific_instructions', 'deltalinqs_gate_instructions', 'h2s_instructions'] },
                        { title: 'Certificaten', fields: ['vca_certificate', 'bhv_certificate', 'work_permit', 'drivers_license'] }
                    ]
                }
            ];

            const currentStepData = STEPS.find(s => s.number === activeStep);

            // Input row component: locked, masked, or normal
            const InputRow = ({ fieldId }) => {
                const def = FIELD_DEFS[fieldId];
                if (!def) return null;
                const visible = isFieldVisible(fieldId);
                const sensitive = isFieldSensitive(fieldId);
                const isRevealed = revealedFields[fieldId];
                const value = personFields[fieldId] || '';

                if (!visible) {
                    // Verborgen veld: vergrendeld + lock-icoon + niet bewerkbaar
                    return (
                        <div className="grid items-center gap-4 py-3 px-4 bg-yim-50 border-b border-yim-100 last:border-0" style={{ gridTemplateColumns: '240px 1fr' }}>
                            <label className="text-sm text-yim-500 flex items-center gap-2">
                                <svg className="w-3.5 h-3.5 text-yim-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clipRule="evenodd" /></svg>
                                {def.name}
                            </label>
                            <div className="flex items-center justify-between">
                                <span className="text-sm text-yim-400 italic">Niet bewerkbaar — geen inzage</span>
                                <span className="text-[10px] font-semibold text-yim-400 bg-yim-100 px-2 py-0.5 rounded uppercase tracking-wider">Vergrendeld</span>
                            </div>
                        </div>
                    );
                }

                const showValue = !sensitive || isRevealed;
                const displayValue = showValue ? value : '••••••••';

                return (
                    <div className="grid items-center gap-4 py-3 px-4 border-b border-yim-100 last:border-0 group hover:bg-yim-50/40" style={{ gridTemplateColumns: '240px 1fr' }}>
                        <label className="text-sm font-medium text-yim-700 flex items-center gap-2">
                            {def.name}
                            {sensitive && !isRevealed && (
                                <svg className="w-3.5 h-3.5 text-yim-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                            )}
                            {isRevealed && (
                                <span className="flex items-center gap-1 text-[10px] text-yim-green font-semibold uppercase tracking-wider">5s</span>
                            )}
                        </label>
                        <div className="flex items-center gap-2">
                            <input type="text" value={displayValue} readOnly={!showValue}
                                className={`flex-1 px-3 py-2 border rounded text-sm focus:ring-2 focus:ring-yim-500 focus:border-yim-500 ${
                                    showValue ? 'border-yim-300 bg-white text-yim-700' : 'border-yim-200 bg-yim-50 text-yim-300 italic'
                                }`}
                                onChange={() => {}}
                            />
                            {sensitive && !isRevealed && canReveal && (
                                <button onClick={() => handleReveal(fieldId)}
                                    className="px-3 py-2 text-xs font-medium text-yim-600 hover:text-yim-700 bg-yim-50 hover:bg-yim-100 border border-yim-200 rounded transition-colors flex items-center gap-1">
                                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                                    Toon (5s)
                                </button>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="fixed inset-0 z-50 bg-white overflow-hidden flex flex-col">
                    {/* Header */}
                    <div className="bg-white border-b border-yim-200 px-6 py-4 flex items-center justify-between shrink-0">
                        <div className="flex items-center gap-4">
                            <button onClick={onClose} className="p-2 text-yim-300 hover:text-yim-600 hover:bg-yim-100 rounded-lg transition-colors">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                            <div>
                                <h2 className="text-lg font-semibold text-yim-700">Contractor dossier bewerken</h2>
                                <p className="text-sm text-yim-500">Jan de Vries · ABC Bouw B.V. · Rol: {role.name}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <span className="text-xs text-yim-500 italic">Wijzigingen in deze prototype-view zijn niet persistent</span>
                        </div>
                    </div>

                    {/* Body: stepper sidebar + content */}
                    <div className="flex flex-1 overflow-hidden">
                        {/* Stepper sidebar */}
                        <div className="w-[280px] flex-shrink-0 bg-yim-700 text-white overflow-y-auto" style={{ borderRadius: '0 0 110px 0' }}>
                            <div className="px-6 pt-12 pb-8">
                                <h3 className="text-2xl font-bold mb-8 pr-8">Contractor dossier bewerken</h3>
                                <ul className="space-y-1">
                                    {STEPS.map(step => {
                                        const isActive = step.number === activeStep;
                                        const isComplete = step.number < activeStep;
                                        return (
                                            <li key={step.number}>
                                                <button onClick={() => { setActiveStep(step.number); setActiveSubSection(null); }}
                                                    className={`w-full text-left px-4 py-3 rounded transition-colors flex items-center gap-3 ${
                                                        isActive ? 'bg-white/10' : 'hover:bg-white/5'
                                                    }`}>
                                                    <span className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ${
                                                        isComplete ? 'bg-yim-green text-white' : isActive ? 'bg-white text-yim-700' : 'bg-white/20 text-white'
                                                    }`}>
                                                        {isComplete ? <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg> : step.number}
                                                    </span>
                                                    <span className={`text-sm ${isActive ? 'font-bold' : ''}`}>{step.title}</span>
                                                </button>
                                                {isActive && step.sections.length > 1 && (
                                                    <ul className="ml-10 mt-1 space-y-0.5 mb-2">
                                                        {step.sections.map((s, idx) => (
                                                            <li key={idx}>
                                                                <button onClick={() => setActiveSubSection(idx)}
                                                                    className={`text-xs py-1.5 px-2 rounded w-full text-left transition-colors ${
                                                                        activeSubSection === idx ? 'text-yellow-300 font-bold bg-white/10' : 'text-white/70 hover:text-white'
                                                                    }`}>
                                                                    {s.title}
                                                                </button>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                )}
                                            </li>
                                        );
                                    })}
                                </ul>
                            </div>
                        </div>

                        {/* Main form area */}
                        <div className="flex-1 overflow-y-auto bg-yim-50/30 p-8">
                            <div className="max-w-4xl mx-auto">
                                {/* Step intro */}
                                <div className="flex items-start gap-4 mb-6">
                                    <span className="w-8 h-8 rounded-full bg-yim-100 text-yim-700 flex items-center justify-center font-bold text-sm">
                                        {currentStepData.number}
                                    </span>
                                    <div>
                                        <h1 className="text-3xl font-bold text-yim-700">{currentStepData.title}</h1>
                                        <p className="text-sm text-yim-500 mt-1">{currentStepData.description}</p>
                                    </div>
                                </div>

                                {/* Sections */}
                                <div className="space-y-6">
                                    {currentStepData.sections.map((section, idx) => {
                                        const visibleCount = section.fields.filter(f => isFieldVisible(f)).length;
                                        const hiddenCount = section.fields.length - visibleCount;
                                        return (
                                            <div key={idx} className="bg-white rounded-lg border border-yim-200 overflow-hidden">
                                                <div className="px-5 py-3 border-b border-yim-100 flex items-center justify-between bg-yim-50/50">
                                                    <h3 className="text-lg font-bold text-yim-700">{section.title}</h3>
                                                    {hiddenCount > 0 && (
                                                        <span className="text-xs font-medium text-yim-500 bg-yim-100 px-2 py-0.5 rounded flex items-center gap-1.5">
                                                            <svg className="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clipRule="evenodd" /></svg>
                                                            {hiddenCount} verborgen
                                                        </span>
                                                    )}
                                                </div>
                                                <div>
                                                    {section.fields.map(f => <InputRow key={f} fieldId={f} />)}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Footer */}
                    <div className="bg-white border-t border-yim-200 px-6 py-4 flex items-center justify-between shrink-0">
                        <button onClick={onClose} className="px-4 py-2 text-sm text-yim-600 hover:bg-yim-100 rounded-lg">
                            ← Terug naar overzicht
                        </button>
                        <div className="flex items-center gap-2">
                            {activeStep > 1 && (
                                <button onClick={() => { setActiveStep(activeStep - 1); setActiveSubSection(null); }} className="px-4 py-2 text-sm text-yim-600 hover:bg-yim-100 rounded-lg">
                                    Vorige
                                </button>
                            )}
                            {activeStep < STEPS.length && (
                                <button onClick={() => { setActiveStep(activeStep + 1); setActiveSubSection(null); }} className="px-5 py-2 bg-yim-500 text-white text-sm font-medium rounded-lg hover:bg-yim-600">
                                    Volgende
                                </button>
                            )}
                            {activeStep === STEPS.length && (
                                <button onClick={onClose} className="px-5 py-2 bg-yim-green text-white text-sm font-medium rounded-lg hover:bg-yim-green/80">
                                    Indienen (demo)
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function App({ roles, setRoles, visibilityProfiles, setVisibilityProfiles, currentTab, setCurrentTab, concept, setConcept }) {
            const [currentRole, setCurrentRole] = useState('admin');
            const [showHelp, setShowHelp] = useState(true);
            const [auditLog, setAuditLog] = useState([]);
            const [showAudit, setShowAudit] = useState(false);
            const [showConceptInfo, setShowConceptInfo] = useState(false);

            const CONCEPT_INFO = {
                A: { number: 1, title: 'Profielen', color: 'bg-yim-orange', how: 'Admin maakt profielen aan (bijv. "Standaard inzage") en koppelt die aan rollen.', what: 'Profiel wijzigen → alle gekoppelde rollen veranderen mee. Bevestiging vereist bij elke wijziging.', key: 'Centraal beheer via herbruikbare profielen' },
                G: { number: 3, title: 'Taakafleiding', color: 'bg-teal-500', how: 'De data-inzage is een afleiding van wat in de rol is geconfigureerd. Op basis van gekozen taken, processen, dossierniveau en bestandstoegang berekent het systeem direct welke gegevens een gebruiker met deze rol kan zien.', what: 'Zowel admin als gebruiker krijgt de afgeleide inzage inzichtelijk gepresenteerd — admin kan vervolgens per veld nog handmatig aan/uit zetten. Risico-balk toont gevoeligheidsniveau, overrides worden gemarkeerd.', key: 'Afleiding uit rol-config + transparantie + veld-overrides' },
            };
            const [revealedFields, setRevealedFields] = useState({});
            const [editMode, setEditMode] = useState(false);

            // Match role config to preset name for viewer badges
            const matchPresetForViewer = (r) => INITIAL_PRESETS.find(p =>
                ALL_CATEGORY_IDS.every(k => !!p.allowedCategories[k] === !!r.allowedCategories?.[k]) &&
                !!p.canReveal === !!r.canReveal
            ) || null;

            // Handle deleted role - reset to first available role
            const roleKeys = Object.keys(roles);
            const validRole = roles[currentRole] ? currentRole : roleKeys[0];
            const role = roles[validRole];

            // Resolve visibility based on active concept
            const profile = concept === 'A' ? visibilityProfiles.find(p => p.id === role.visibilityProfileId) : null;
            const canReveal = concept === 'A' ? (profile?.canReveal || false) : (role.canReveal || false);
            // Bewerkrecht: Concept G leidt af uit de taak 'dossier_bewerken' (single source of truth).
            // Concept A leest 'm nog van het profiel (geen taken in dat model).
            const canEditDossier = concept === 'A'
                ? (profile?.canEditDossier || false)
                : (role.roleSettings?.taken || []).includes('dossier_bewerken');

            // Log field reveal
            const logFieldReveal = (category, field, value) => {
                const entry = {
                    timestamp: new Date().toISOString(),
                    role: role.name,
                    category,
                    field,
                    value: value.substring(0, 20) + (value.length > 20 ? '...' : ''),
                    action: 'FIELD_REVEAL'
                };
                setAuditLog(prev => [entry, ...prev]);
            };

            // Handle field reveal with 5-second timeout
            const handleReveal = (fieldKey, category, field, value) => {
                if (!canReveal) return;

                setRevealedFields(prev => ({ ...prev, [fieldKey]: true }));
                logFieldReveal(category, field, value);

                // Auto-hide after 5 seconds
                setTimeout(() => {
                    setRevealedFields(prev => {
                        const updated = { ...prev };
                        delete updated[fieldKey];
                        return updated;
                    });
                }, 5000);
            };

            // Mask sensitive values (no permission levels - purely based on sensitivity)
            const maskSensitiveValue = (value, sensitive, isRevealed = false) => {
                if (isRevealed || !sensitive) return value;
                if (typeof value === 'string') {
                    if (value.includes('@')) {
                        const [user, domain] = value.split('@');
                        return `${user.substring(0, 2)}••••@${domain}`;
                    }
                    if (value.includes('+31')) return '+31 6 ••••••78';
                    if (value.length > 8) return value.substring(0, 3) + '••••••';
                }
                return '••••••••';
            };

            const DataField = ({ label, value, sensitive, fieldId, groupId }) => {
                // Map legacy field/group id → 9-category id
                const catId = FIELD_TO_CATEGORY[groupId] || groupId;
                // All concepts use allowedCategories (on profile for A, on role for E/G, computed for C)
                const effectiveCats = concept === 'A' ? profile?.allowedCategories : role.allowedCategories;
                const isVisible = effectiveCats?.[catId] === true;
                if (!isVisible) return null;

                const fieldKey = `${groupId}.${fieldId}`;
                const isRevealed = revealedFields[fieldKey];
                const displayValue = maskSensitiveValue(value, sensitive, isRevealed);
                const isMasked = sensitive && !isRevealed;
                const canRevealField = canReveal && isMasked;

                return (
                    <div className="flex justify-between items-start py-3 border-b border-yim-100 last:border-0 group">
                        <div className="flex items-center gap-2">
                            <span className="text-sm text-yim-600 opacity-70 w-36">{label}</span>
                            {isMasked && (
                                <svg className="w-3.5 h-3.5 text-yim-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                            )}
                            {isRevealed && (
                                <span className="flex items-center gap-1 text-xs text-yim-green">
                                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                    </svg>
                                    5s
                                </span>
                            )}
                        </div>
                        <div className="flex items-center gap-2">
                            <span className={`text-sm font-medium ${isMasked ? 'text-yim-300' : 'text-yim-600'}`}>
                                {displayValue}
                            </span>
                            {canRevealField && (
                                <button
                                    onClick={() => handleReveal(fieldKey, groupId, label, value)}
                                    className="opacity-0 group-hover:opacity-100 transition-opacity px-2 py-1 text-xs font-medium text-yim-500 hover:text-yim-600 hover:bg-yim-50 rounded"
                                    title="Toon gedurende 5 seconden"
                                >
                                    Toon
                                </button>
                            )}
                        </div>
                    </div>
                );
            };

            const VisibilityBadge = ({ visible }) => {
                return visible ? (
                    <span className="px-2.5 py-1 rounded-md text-xs font-medium bg-yim-green/10 text-yim-green border border-yim-green/30">
                        Zichtbaar
                    </span>
                ) : (
                    <span className="px-2.5 py-1 rounded-md text-xs font-medium bg-yim-50 text-yim-600 opacity-70 border border-yim-200">
                        Verborgen
                    </span>
                );
            };

            const DataSection = ({ title, groups, icon, children }) => {
                // Section visibility: all concepts use allowedCategories (on profile for A, role for E/G, computed for C)
                const secCats = concept === 'A' ? profile?.allowedCategories : role.allowedCategories;
                const hasVisibleGroup = groups.some(g => secCats?.[FIELD_TO_CATEGORY[g] || g] === true);

                if (!hasVisibleGroup) {
                    return (
                        <div className="bg-white rounded-xl border border-yim-200 p-6 opacity-50">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-10 h-10 rounded-lg bg-yim-100 flex items-center justify-center">
                                    {icon}
                                </div>
                                <h3 className="text-base font-semibold text-yim-600 flex-1">{title}</h3>
                                <span className="text-xs text-yim-600 opacity-60 flex items-center gap-1">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                                    </svg>
                                    Geen toegang
                                </span>
                            </div>
                            <p className="text-sm text-yim-600 opacity-60">Deze gegevens zijn niet zichtbaar voor uw rol.</p>
                        </div>
                    );
                }

                return (
                    <div className="bg-white rounded-xl border border-yim-200 p-6 hover:border-yim-300 transition-colors">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="w-10 h-10 rounded-lg bg-yim-50 flex items-center justify-center">
                                {icon}
                            </div>
                            <h3 className="text-base font-semibold text-yim-600 flex-1">{title}</h3>
                            <VisibilityBadge visible={true} />
                        </div>
                        <div>{children}</div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen">
                    {/* Header */}
                    <div className="bg-white border-b border-yim-200 sticky top-0 z-10">
                        <div className="max-w-6xl mx-auto px-6 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <svg className="w-8 h-8 text-yim-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                                    </svg>
                                    <div>
                                        <h1 className="text-xl font-semibold text-yim-600">YIM Data Privacy</h1>
                                        <p className="text-sm text-yim-600 opacity-60">Rolgebaseerde toegangscontrole met audit logging</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="flex bg-yim-100 rounded-lg p-1">
                                        <button
                                            onClick={() => setCurrentTab('viewer')}
                                            className={`px-4 py-1.5 text-sm font-medium rounded-md transition-colors ${
                                                currentTab === 'viewer'
                                                    ? 'bg-white text-yim-600 shadow-sm'

        // ============ HELPER: Compute flat category maps from sensitivity level ============
        const getCategoriesForLevel = (level, exceptions = {}) => {
            const compute = (items, exKey) => {
                const result = {};
                items.forEach(item => {
                    const base = CATEGORY_MIN_LEVEL[item.id] <= level;
                    result[item.id] = exceptions[exKey]?.[item.id] !== undefined ? exceptions[exKey][item.id] : base;
                });
                return result;
            };
            const result = {
                categories: compute(dataGroups, 'categories'),
                dossierCategories: compute(dossierComponents, 'dossierCategories'),
                certCategories: compute(certificateCategories, 'certCategories'),
                fileCategories: compute(fileCategories, 'fileCategories')
            };
            // Also include hierarchy subcategories not in legacy arrays.
            // Map nieuwe hierarchy IDs naar legacy buckets voor backwards compat.
            const hierarchyBucketMap = {
                'persoonsgegevens': 'categories',
                'identificatie': 'categories',      // Overheids-ID hoort onder persoonsgegevens-bucket
                'arbeid': 'dossierCategories',       // Werkgever + sociale lasten = dossier
                'kwalificaties': 'dossierCategories', // Compliance + cert = dossier-bucket
                'bestanden': 'fileCategories',
                'toegang': 'dossierCategories',      // Toegang & voertuig fallback
                // Legacy fallbacks
                'dossier': 'dossierCategories',
                'certificaten': 'certCategories'
            };
            CATEGORY_HIERARCHY.forEach(h => {
                const bucket = hierarchyBucketMap[h.id] || 'categories';
                h.subcategories.forEach(s => {
                    if (result[bucket][s.id] === undefined) {
                        const base = CATEGORY_MIN_LEVEL[s.id] <= level;
                        result[bucket][s.id] = exceptions[bucket]?.[s.id] !== undefined ? exceptions[bucket][s.id] : base;

            // Bridge: derive allowedCategories (9 auth cats) from legacy field-level booleans
            const allFields = { ...result.categories, ...result.dossierCategories, ...result.certCategories, ...result.fileCategories };
            const allowedCategories = {};
            ALL_CATEGORY_IDS.forEach(catId => { allowedCategories[catId] = false; });
            Object.entries(allFields).forEach(([fieldId, isAllowed]) => {
                if (isAllowed) {
                    const authCat = FIELD_TO_CATEGORY[fieldId] || fieldId;
                    if (allowedCategories[authCat] !== undefined) allowedCategories[authCat] = true;
                }
            });
            result.allowedCategories = allowedCategories;
            return result;
        };

        // ============ Derivation Engine (Task → Category Mapping, used by Concept C suggestion) ============
        const TASK_CATEGORY_MAP = {
            aanmelden: { categories: ['identity', 'contact_work'] },
            autorisaties_bewerken: { categories: ['identity', 'compliance', 'access'] },
            deactivatie_beoordelen: { categories: ['identity', 'compliance'] },
            dossier_bekijken: { categories: ['identity', 'compliance', 'hours', 'employment'] },
            dossier_beoordelen: { categories: ['identity', 'compliance', 'hours', 'employment', 'government_id'] },
            dossier_bewerken: { categories: ['identity', 'compliance', 'hours', 'employment', 'government_id', 'address'] },
            dossier_registreren: { categories: ['identity', 'contact_work', 'employment'] },
            foto_upload: { categories: ['identity'], dossier: ['foto'] },
            examen_afronden: { categories: ['identity'], certs: ['vca'] },
            heractivatie_beoordelen: { categories: ['identity', 'compliance'] },
            identificatie_aanvragen: { categories: ['identity', 'government_id'], dossier: ['identificatie_locatie', 'identificatie_bsn'] },
            identificatie_beoordelen: { categories: ['identity', 'government_id'], dossier: ['identificatie_locatie', 'identificatie_bsn'] },
            identificatie_intrekken: { categories: ['identity'], dossier: ['identificatie_locatie'] },
            contract_beeindigen: { categories: ['identity', 'employment'] },
            elearning_uitnodiging: { categories: ['identity', 'contact_work'] },
            uploaden: { categories: ['identity'] },
            examenpoging_toevoegen: { categories: ['identity'], certs: ['vca'] },
            autorisaties_beoordelen: { categories: ['identity', 'compliance', 'access'] }
        };
        const DOSSIERNIVEAU_MAP = {
            aanmeldingen: { categories: ['identity', 'contact_work'] },
            autorisaties: { categories: ['access', 'compliance'] },
            certificates: { certs: ['vca', 'bhv', 'werkvergunning', 'rijbewijs'], dossier: ['vca_certificaten'] },
            dossier_informatie: { categories: ['employment', 'address'] },
            evenementen: { categories: ['hours'] },
            gebruikers_bedrijf: { categories: ['employment'] },
            geschiedenis: { categories: ['compliance'] },
            identificaties: { categories: ['government_id'], dossier: ['identificatie_locatie', 'identificatie_bsn'] },
            personen_bedrijf: { categories: ['identity', 'contact_work', 'employment'] }
        };
        const BESTAND_MAP = {
            certificaten: { files: ['a1_verklaring', 'verzekeringsbewijs'], certs: ['vca', 'bhv', 'werkvergunning'] },
            persoonlijk: { files: ['arbeidsovereenkomst', 'loonstroken', 'id_kopie'] }
        };

        const deriveCategories = (roleSettings) => {
            if (!roleSettings) return { categories: {}, dossierCategories: {}, certCategories: {}, fileCategories: {}, _justifications: {} };
            const result = { categories: {}, dossierCategories: {}, certCategories: {}, fileCategories: {} };
            const justifications = {};
            const addJ = (group, catId, reason) => {
                if (!justifications[group]) justifications[group] = {};
                if (!justifications[group][catId]) justifications[group][catId] = [];
                if (!justifications[group][catId].includes(reason)) justifications[group][catId].push(reason);
            };
            // 1. Taken → categories
            (roleSettings.taken || []).forEach(taskId => {
                const map = TASK_CATEGORY_MAP[taskId];
                if (!map) return;
                const name = TAKEN.find(t => t.id === taskId)?.name || taskId;
                (map.categories || []).forEach(c => { result.categories[c] = true; addJ('categories', c, name); });
                (map.dossier || []).forEach(c => { result.dossierCategories[c] = true; addJ('dossierCategories', c, name); });
                (map.certs || []).forEach(c => { result.certCategories[c] = true; addJ('certCategories', c, name); });
                (map.files || []).forEach(c => { result.fileCategories[c] = true; addJ('fileCategories', c, name); });
            });
            // 2. Dossierniveau → categories
            (roleSettings.dossierniveau || []).forEach(dnId => {
                const map = DOSSIERNIVEAU_MAP[dnId];
                if (!map) return;
                const name = DOSSIERNIVEAU.find(d => d.id === dnId)?.name || dnId;
                (map.categories || []).forEach(c => { result.categories[c] = true; addJ('categories', c, name); });
                (map.dossier || []).forEach(c => { result.dossierCategories[c] = true; addJ('dossierCategories', c, name); });
                (map.certs || []).forEach(c => { result.certCategories[c] = true; addJ('certCategories', c, name); });
                (map.files || []).forEach(c => { result.fileCategories[c] = true; addJ('fileCategories', c, name); });
            });
            // 3. Bestand toegangen → categories
            (roleSettings.bestand_toegangen || []).forEach(btId => {
                const map = BESTAND_MAP[btId];
                if (!map) return;
                const name = BESTAND_TOEGANGEN.find(b => b.id === btId)?.name || btId;
                (map.categories || []).forEach(c => { result.categories[c] = true; addJ('categories', c, name); });
                (map.dossier || []).forEach(c => { result.dossierCategories[c] = true; addJ('dossierCategories', c, name); });
                (map.certs || []).forEach(c => { result.certCategories[c] = true; addJ('certCategories', c, name); });
                (map.files || []).forEach(c => { result.fileCategories[c] = true; addJ('fileCategories', c, name); });
            });
            // Always include identity if any tasks selected
            if ((roleSettings.taken || []).length > 0) result.categories.identity = true;
            return { ...result, _justifications: justifications };
        };

        // ============ Concept G: Derive 9 auth-categories from roleSettings ============
        const deriveTo9Categories = (roleSettings) => {
            const derived = deriveCategories(roleSettings);
            const allFields = { ...derived.categories, ...derived.dossierCategories,
                                ...derived.certCategories, ...derived.fileCategories };
            const allowedCategories = {};
            ALL_CATEGORY_IDS.forEach(id => { allowedCategories[id] = false; });
            Object.entries(allFields).forEach(([fieldId, isAllowed]) => {
                if (isAllowed) {
                    const authCat = FIELD_TO_CATEGORY[fieldId] || fieldId;
                    if (allowedCategories[authCat] !== undefined) allowedCategories[authCat] = true;
                }
            });
            // Map justifications to 9-cat format
            const justifications9 = {};
            ['categories','dossierCategories','certCategories','fileCategories'].forEach(group => {
                Object.entries(derived._justifications[group] || {}).forEach(([fieldId, reasons]) => {
                    const catId = FIELD_TO_CATEGORY[fieldId] || fieldId;
                    if (!justifications9[catId]) justifications9[catId] = [];
                    reasons.forEach(r => { if (!justifications9[catId].includes(r)) justifications9[catId].push(r); });
                });
            });
            return { allowedCategories, _justifications9: justifications9 };
        };

        // Concept G: Task-driven derivation — categories computed from roleSettings
        const createGRole = (name, desc, settingsFactory, canReveal, canEditDossier) => {
            const rs = settingsFactory();
            const { allowedCategories, _justifications9 } = deriveTo9Categories(rs);
            return {
                name, description: desc, canReveal, canEditDossier, roleSettings: rs,
                allowedCategories,
                _derivedCategories: { ...allowedCategories },
                _justifications9, _overrides: {}
            };
        };
        const initialRolesG = {
            admin: createGRole('Administrator', 'Volledige toegang', createAdminRoleSettings, true, true),
            hr: createGRole('HR Manager', 'Persoons- en arbeidsgegevens', createHRRoleSettings, true, true),
            security: createGRole('Security Manager', 'Compliance en toegang', createSecurityRoleSettings, false, false),
            contractor: createGRole('Contractor', 'Beperkte toegang', createMinimalRoleSettings, false, false),
            guest: createGRole('Guest', 'Basis verificatie', createDefaultRoleSettings, false, false),
        };

        // ============ Concept C: Suggest sensitivity level from derivation ============
        const suggestSensitivityLevel = (roleSettings) => {
            const derived = deriveCategories(roleSettings);
            let maxLevel = 1;
            const allDerived = { ...derived.categories, ...derived.dossierCategories,
                                 ...derived.certCategories, ...derived.fileCategories };
            Object.entries(allDerived).forEach(([catId, isActive]) => {
                if (isActive && CATEGORY_MIN_LEVEL[catId]) {
                    maxLevel = Math.max(maxLevel, CATEGORY_MIN_LEVEL[catId]);
                }
            });
            return { level: maxLevel, _justifications: derived._justifications };
        };

        // ============ Concept C roles (sensitivity level based + derived justifications) ============
        const initialRolesC = (() => {
            const makeRole = (name, desc, level, settingsFactory, canReveal, canEditDossier) => {
                const rs = settingsFactory();
                const { _justifications } = suggestSensitivityLevel(rs);
                return { name, description: desc, sensitivityLevel: level, exceptions: {}, canReveal, canEditDossier, roleSettings: rs,
                  ...getCategoriesForLevel(level), _justifications };
            };
            return {
                admin: makeRole("Administrator", "Volledige toegang", 4, createAdminRoleSettings, true, true),
                hr: makeRole("HR Manager", "Persoons- en arbeidsgegevens", 3, createHRRoleSettings, true, true),
                security: makeRole("Security Manager", "Compliance en toegang", 2, createSecurityRoleSettings, false, false),
                contractor: makeRole("Contractor", "Beperkte toegang", 2, createSecurityRoleSettings, false, false),
                guest: makeRole("Guest", "Basis verificatie", 1, createMinimalRoleSettings, false, false)
            };
        })();

        // Status Dropdown component for dossier components - sophisticated muted colors

        // ============ DualListSelector Component ============
        function DualListSelector({ items, selected, onChange, maxHeight = 180 }) {
            const available = items.filter(i => !selected.includes(i.id));
            const selectedItems = items.filter(i => selected.includes(i.id));

            const addItem = (id) => onChange([...selected, id]);
            const removeItem = (id) => onChange(selected.filter(x => x !== id));

            const ListCol = ({ title, count, total, items: listItems, onClickItem, icon }) => (
                <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between mb-1.5">
                        <span className="text-xs font-semibold text-yim-500 uppercase tracking-wide">{title}</span>

                            <div className="px-3 py-4 text-xs text-yim-400 text-center italic">Geen items</div>

                                <span className="text-yim-400 text-xs flex-shrink-0">{icon}</span>
                            </div>

                    </div>
                </div>
            );

            return (
                <div className="flex gap-3">
                    <ListCol title="Beschikbaar" count={available.length} total={items.length}
                        items={available} onClickItem={addItem} icon="→" />
                    <ListCol title="Geselecteerd" count={selectedItems.length} total={items.length}
                        items={selectedItems} onClickItem={removeItem} icon="←" />

                                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                </svg>

                            </button>

        // Admin Panel Component - with profiles management and role editor
        function AdminPanel({ roles, setRoles, visibilityProfiles, setVisibilityProfiles, concept }) {

            const allCategoryLookup = React.useMemo(() => {

            const moveCategory = (catId, fromGroupId, toGroupId) => {

            const unassignedCategories = React.useMemo(() =>

            , [allCategoryIds, assignedCategoryIds]);

            // Sidebar menu items for Beheer
            const allMenuItems = [
                { id: 'roles', label: 'Rollenbeheer' },

            const menuItems = allMenuItems.filter(item => !item.conceptA || concept === 'A');

            // ============ ROLE EDITOR LOGIC ============

            const openRoleEditor = (key) => {

            const handleDuplicateRole = (sourceKey) => {
                const original = roles[sourceKey];

                const copy = JSON.parse(JSON.stringify(original));
                copy.name = `Kopie van ${original.name}`;
                const newKey = `${sourceKey}_copy_${Date.now()}`;
                setRoles(prev => ({ ...prev, [newKey]: copy }));

            const openNewRoleEditor = () => {
                const newRole = concept === 'A'
                    ? { name: '', description: '', visibilityProfileId: visibilityProfiles[0]?.id || 'minimal', roleSettings: createDefaultRoleSettings() }
                    : concept === 'C'
                    ? (() => { const rs = createDefaultRoleSettings(); const { level, _justifications } = suggestSensitivityLevel(rs); return { name: '', description: '', sensitivityLevel: level, exceptions: {}, canReveal: false, roleSettings: rs, ...getCategoriesForLevel(level), _justifications }; })()
                    : concept === 'G'
                    ? (() => {
                        const rs = createDefaultRoleSettings();
                        const { allowedCategories, _justifications9 } = deriveTo9Categories(rs);
                        return { name: '', description: '', canReveal: false, roleSettings: rs,
                            allowedCategories,
                            _derivedCategories: { ...allowedCategories }, _justifications9, _overrides: {} };

                setSelectedRole('new');

            const closeRoleEditor = () => {
                setSelectedRole(null);
                setEditForm({});
                setIsNewRole(false);
                setExpandedCatId(null);

            const saveRole = () => {
                // Concept G: persist live-derived state so role table + viewer reflect current roleSettings
                let toSave = editForm;
                if (concept === 'G') {
                    const { allowedCategories: derived, _justifications9 } = deriveTo9Categories(editForm.roleSettings || createDefaultRoleSettings());
                    const overrides = editForm._overrides || {};
                    const final = { ...derived };
                    Object.entries(overrides).forEach(([k, v]) => { final[k] = v; });
                    toSave = { ...editForm, allowedCategories: final, _derivedCategories: derived, _justifications9 };
                }
                if (isNewRole) {
                    const key = editForm.name.toLowerCase().replace(/\s+/g, '_');
                    setRoles(prev => ({ ...prev, [key]: toSave }));
                } else {
                    setRoles(prev => ({ ...prev, [selectedRole]: toSave }));

                closeRoleEditor();
            };

            const deleteRole = (key) => {
                setRoles(prev => {
                    const updated = { ...prev };
                    delete updated[key];
                    return updated;
                });
                setDeleteConfirm(null);
                closeRoleEditor();
            };

            // ============ PROFILE EDITOR LOGIC ============

            const initializeProfileGroups = (profile) => {
                const cats = { ...profile.allowedCategories };
                ALL_CATEGORY_IDS.forEach(id => {
                    if (cats[id] === undefined) cats[id] = false;
                });
                return { ...profile, allowedCategories: cats };

            const openProfileEditor = (profileId) => {
                const profile = visibilityProfiles.find(p => p.id === profileId);
                if (!profile) return;
                setSelectedProfile(profileId);
                setProfileEditForm(initializeProfileGroups({ ...profile }));
                setExpandedGroups({});
                setIsNewProfile(false);
                setShowAllRoles(false);
                setSaveConfirm(false);

            const handleDuplicateProfile = (sourceId) => {
                const original = visibilityProfiles.find(p => p.id === sourceId);
                if (!original) return;
                const copy = JSON.parse(JSON.stringify(original));
                copy.name = `Kopie van ${original.name}`;
                const newId = `${sourceId}_copy_${Date.now()}`;
                copy.id = newId;
                setVisibilityProfiles(prev => [...prev, copy]);
                // Auto-open de kopie ter bewerking
                setTimeout(() => {
                    setSelectedProfile(newId);
                    setProfileEditForm(initializeProfileGroups({ ...copy }));
                    setExpandedGroups({});
                    setIsNewProfile(false);
                    setShowAllRoles(false);
                    setSaveConfirm(false);
                }, 50);
            };

            const openNewProfileEditor = () => {
                const cats = {};
                ALL_CATEGORY_IDS.forEach(id => { cats[id] = false; });
                const newProfile = {
                    id: '',
                    name: '',
                    description: '',
                    canReveal: false,
                    allowedCategories: cats
                };
                setSelectedProfile('new');
                setProfileEditForm(newProfile);
                setExpandedGroups({});
                setIsNewProfile(true);
            };

            const closeProfileEditor = () => {
                setSelectedProfile(null);
                setProfileEditForm({});
                setExpandedGroups({});
                setActiveTab('data_inzage');
                setIsNewProfile(false);
                setShowAllRoles(false);
                setSaveConfirm(false);
                setExpandedCatId(null);
            };

            const confirmSaveProfile = () => {
                if (isNewProfile) {
                    const id = profileEditForm.name.toLowerCase().replace(/\s+/g, '_');
                    setVisibilityProfiles(prev => [...prev, { ...profileEditForm, id }]);
                } else {
                    setVisibilityProfiles(prev => Array.isArray(prev) ? prev.map(p => p.id === selectedProfile ? profileEditForm : p) : prev);
                }
                closeProfileEditor();
            };

            const saveProfile = () => {
                // Nieuwe profielen direct opslaan; bestaande profielen altijd bevestigen
                // (raakt eventueel gekoppelde rollen — admin moet bewust beslissen)
                if (isNewProfile) {
                    confirmSaveProfile();
                } else {
                    setSaveConfirm(true);
                }
            };

            const deleteProfile = (profileId) => {
                setVisibilityProfiles(prev => prev.filter(p => p.id !== profileId));
                setDeleteProfileConfirm(null);
                closeProfileEditor();
            };

            // ============ SHARED HELPERS ============

            const toggleGroupExpand = (groupId) => {
                setExpandedGroups(prev => ({ ...prev, [groupId]: !prev[groupId] }));
            };

            const toggleProfileCategory = (catId) => {
                setProfileEditForm(prev => ({
                    ...prev,
                    allowedCategories: { ...prev.allowedCategories, [catId]: !prev.allowedCategories[catId] }
                }));
            };

            const getProfileForRole = (roleData) => {
                return visibilityProfiles.find(p => p.id === roleData.visibilityProfileId);
            };

            // ============ PROFILE EDITOR MODAL ============

            if (selectedProfile) {
                const linkedRoles = isNewProfile ? [] : Object.entries(roles).filter(([_, r]) => r.visibilityProfileId === selectedProfile);
                const impactCount = linkedRoles.length;
                const impactColor = impactCount === 0 ? 'text-yim-600 opacity-50' : impactCount <= 5 ? 'bg-yim-orange/10 text-yim-orange' : 'bg-yim-red/10 text-yim-red';
                const impactIcon = impactCount <= 5 ? 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z' : 'M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z';
                const visibleRoles = showAllRoles ? linkedRoles : linkedRoles.slice(0, 3);
                return (
                    <div className="fixed inset-0 bg-yim-100 z-50 overflow-hidden flex flex-col">
                        <div className="bg-white border-b border-yim-200 px-6 py-4 flex items-center justify-between shrink-0">
                            <div className="flex items-center gap-4">
                                <button onClick={closeProfileEditor} className="p-2 text-yim-300 hover:text-yim-600 opacity-70 hover:bg-yim-100 rounded-lg transition-colors">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                                <div>
                                    <h2 className="text-lg font-semibold text-yim-600">
                                        {isNewProfile ? 'Nieuw profiel aanmaken' : profileEditForm.name || 'Profiel bewerken'}

                                    <p className="text-sm text-yim-600 opacity-60">
                                        {Object.values(profileEditForm.allowedCategories || {}).filter(Boolean).length}/{ALL_CATEGORY_IDS.length} categorieën
                                    </p>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                {!isNewProfile && (
                                    <button onClick={() => setDeleteProfileConfirm(selectedProfile)} className="px-4 py-2 text-sm text-yim-red hover:bg-yim-red/10 rounded-lg transition-colors">

                                <button onClick={closeProfileEditor} className="px-4 py-2 text-sm text-yim-600 hover:bg-yim-100 rounded-lg transition-colors">

                                    {isNewProfile ? 'Profiel aanmaken' : 'Opslaan'}
                                </button>
                            </div>
                        </div>

                        {/* Impact Banner */}
                        {!isNewProfile && (
                            <div className={`px-6 py-3 border-b border-yim-200 ${impactCount === 0 ? 'bg-yim-50' : impactCount <= 5 ? 'bg-yim-orange/5 border-yim-orange/20' : 'bg-yim-red/5 border-yim-red/20'}`}>
                                <div className="max-w-4xl mx-auto flex items-center gap-3">
                                    {impactCount > 0 && (
                                        <svg className={`w-4 h-4 flex-shrink-0 ${impactCount <= 5 ? 'text-yim-orange' : 'text-yim-red'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={impactIcon} />

                                    <div className="flex-1 flex items-center gap-2 flex-wrap">
                                        {impactCount === 0 ? (

                                        ) : (
                                            <>
                                                <span className={`text-xs font-semibold ${impactCount <= 5 ? 'text-yim-orange' : 'text-yim-red'}`}>
                                                    {impactCount <= 5 ? `Let op: ${impactCount} ${impactCount === 1 ? 'rol wordt' : 'rollen worden'} beïnvloed` : `Hoge impact: ${impactCount} rollen worden beïnvloed`}
                                                </span>
                                                <span className="text-xs text-yim-600 opacity-40">—</span>
                                                {visibleRoles.map(([key, r]) => (
                                                    <span key={key} className={`px-2 py-0.5 text-xs rounded font-medium ${impactCount <= 5 ? 'bg-yim-orange/10 text-yim-orange' : 'bg-yim-red/10 text-yim-red'}`}>{r.name}</span>
                                                ))}
                                                {!showAllRoles && linkedRoles.length > 3 && (
                                                    <button onClick={() => setShowAllRoles(true)} className={`text-xs font-medium underline underline-offset-2 ${impactCount <= 5 ? 'text-yim-orange' : 'text-yim-red'}`}>
                                                        en {linkedRoles.length - 3} andere rollen
                                                    </button>
                                                )}
                                                {showAllRoles && linkedRoles.length > 3 && (
                                                    <button onClick={() => setShowAllRoles(false)} className={`text-xs font-medium underline underline-offset-2 ${impactCount <= 5 ? 'text-yim-orange' : 'text-yim-red'}`}>
                                                        minder tonen
                                                    </button>
                                                )}
                                            </>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="flex-1 overflow-y-auto p-6">
                            <div className="max-w-4xl mx-auto space-y-6">
                                {/* Profile info */}
                                <div className="bg-white rounded-xl border border-yim-200 overflow-hidden">
                                    <div className="px-5 py-4 border-b border-yim-200">
                                        <h3 className="text-sm font-semibold text-yim-600">Profiel informatie</h3>
                                    </div>
                                    <div className="p-5">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-medium text-yim-600 opacity-60 mb-1.5 uppercase tracking-wide">Naam</label>
                                                <input type="text" value={profileEditForm.name || ''} onChange={(e) => setProfileEditForm(prev => ({ ...prev, name: e.target.value }))} className="w-full px-3 py-2.5 border border-yim-300 rounded-lg text-sm focus:ring-2 focus:ring-yim-500 focus:border-yim-500" placeholder="Bijv. Standaard inzage" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-yim-600 opacity-60 mb-1.5 uppercase tracking-wide">Beschrijving</label>
                                                <input type="text" value={profileEditForm.description || ''} onChange={(e) => setProfileEditForm(prev => ({ ...prev, description: e.target.value }))} className="w-full px-3 py-2.5 border border-yim-300 rounded-lg text-sm focus:ring-2 focus:ring-yim-500 focus:border-yim-500" placeholder="Korte beschrijving" />
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Category-based visibility controls (zelfde drill-down + risicobalk als Concept 3) */}
                                <div className="bg-white rounded-xl border border-yim-200 overflow-hidden">
                                    <div className="px-5 py-4 border-b border-yim-200">
                                        <h3 className="text-sm font-semibold text-yim-700">Data-inzage</h3>
                                        <p className="text-xs text-yim-500 opacity-70 mt-0.5">Vink een categorie aan om data zichtbaar te maken. Klap open voor veld-niveau control.</p>
                                    </div>

                                    {/* Risico-balk (zelfde als Concept 3) */}
                                    {(() => {
                                        const finalCats = profileEditForm.allowedCategories || {};
                                        const sensitivityToLevel = { basis: 2, gevoelig: 3, zeer_gevoelig: 4 };
                                        const sensitivityLabels = { 1: 'Geen inzage', 2: 'Basis', 3: 'Gevoelig', 4: 'Zeer gevoelig' };
                                        const sensitivityColors = { 1: '#9CA3AF', 2: '#10B981', 3: '#F59E0B', 4: '#EF4444' };
                                        let maxLevel = 1;
                                        const activeNames = [];
                                        CATEGORIES.forEach(cat => {
                                            if (finalCats[cat.id]) {
                                                activeNames.push(cat.name);
                                                const lvl = sensitivityToLevel[cat.sensitivity] || 1;
                                                if (lvl > maxLevel) maxLevel = lvl;
                                            }
                                        });
                                        const markerColor = sensitivityColors[maxLevel];
                                        const markerLabel = sensitivityLabels[maxLevel];
                                        const positionPct = ((maxLevel - 1) / 3) * 100;
                                        return (
                                            <div className="px-5 py-4 border-b border-yim-100">
                                                <div className="flex items-center justify-between mb-2">
                                                    <div>
                                                        <h4 className="text-xs font-bold text-yim-600 uppercase tracking-wider">Risico-inzage</h4>
                                                        <p className="text-[11px] text-yim-500 opacity-60 mt-0.5">Gevoeligheidsniveau van actieve categorieën</p>
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="text-[11px] font-bold uppercase tracking-wider" style={{ color: markerColor }}>{markerLabel}</span>
                                                        <p className="text-[10px] text-yim-500 opacity-70 mt-0.5">{activeNames.length} categorie(ën) actief</p>
                                                    </div>
                                                </div>
                                                <div className="relative">
                                                    <div className="flex h-3 rounded-full overflow-hidden">
                                                        <div className="flex-1" style={{ backgroundColor: '#9CA3AF', opacity: maxLevel >= 1 ? 1 : 0.3 }}></div>
                                                        <div className="flex-1" style={{ backgroundColor: '#10B981', opacity: maxLevel >= 2 ? 1 : 0.3 }}></div>
                                                        <div className="flex-1" style={{ backgroundColor: '#F59E0B', opacity: maxLevel >= 3 ? 1 : 0.3 }}></div>
                                                        <div className="flex-1" style={{ backgroundColor: '#EF4444', opacity: maxLevel >= 4 ? 1 : 0.3 }}></div>
                                                    </div>
                                                    <div className="absolute -bottom-1.5 transition-all duration-300"
                                                        style={{ left: `calc(${positionPct}% + (${50 - positionPct}% / 4))`, transform: 'translateX(-50%)' }}>
                                                        <svg className="w-4 h-4" viewBox="0 0 12 12">
                                                            {/* Witte achtergrond + donkere border — altijd zichtbaar tegen elke segmentkleur */}
                                                            <path d="M6 0 L12 10 L0 10 Z" fill="white" stroke="#346474" strokeWidth="1.5" strokeLinejoin="round" />
                                                        </svg>
                                                    </div>
                                                </div>
                                                <div className="flex justify-between mt-3 text-[10px] text-yim-500 opacity-60">
                                                    <span>Geen</span><span>Basis</span><span>Gevoelig</span><span>Zeer gevoelig</span>
                                                </div>
                                            </div>
                                        );
                                    })()}

                                    {/* Drill-down per categorie */}
                                    <div className="px-5 py-4 space-y-2">
                                        {CATEGORIES.map(cat => {
                                            const isActive = !!profileEditForm.allowedCategories?.[cat.id];
                                            const isAllOrNothing = cat.allOrNothing === true;
                                            const isExpanded = expandedCatId === `profile-${cat.id}`;
                                            const canExpand = !isAllOrNothing;
                                            const fieldOverrides = (profileEditForm._fieldOverrides || {})[cat.id] || {};
                                            const hiddenFieldCount = Object.values(fieldOverrides).filter(v => v === false).length;
                                            const totalFields = cat.fields.length;
                                            const visibleFieldCount = totalFields - hiddenFieldCount;

                                            const toggleCat = () => {
                                                setProfileEditForm(prev => {
                                                    const newCats = { ...prev.allowedCategories, [cat.id]: !isActive };
                                                    // Clear field overrides als categorie uit gaat
                                                    const fo = { ...(prev._fieldOverrides || {}) };
                                                    if (isActive) delete fo[cat.id];
                                                    return { ...prev, allowedCategories: newCats, _fieldOverrides: fo };
                                                });
                                            };
                                            const toggleField = (fieldId) => {
                                                setProfileEditForm(prev => {
                                                    const catActive = !!prev.allowedCategories?.[cat.id];
                                                    // Categorie uit + klik op chip → activeer + alleen dit veld zichtbaar (rest via override op false)
                                                    if (!catActive) {
                                                        const newOverrides = {};
                                                        cat.fields.forEach(f => {
                                                            if (f.id !== fieldId) newOverrides[f.id] = false;
                                                        });
                                                        const fo = { ...(prev._fieldOverrides || {}) };
                                                        fo[cat.id] = newOverrides;
                                                        return {
                                                            ...prev,
                                                            allowedCategories: { ...prev.allowedCategories, [cat.id]: true },
                                                            _fieldOverrides: fo
                                                        };
                                                    }
                                                    // Normaal: toggle individuele veld-zichtbaarheid
                                                    const fo = { ...(prev._fieldOverrides || {}) };
                                                    const cf = { ...(fo[cat.id] || {}) };
                                                    if (cf[fieldId] === false) delete cf[fieldId];
                                                    else cf[fieldId] = false;
                                                    if (Object.keys(cf).length === 0) delete fo[cat.id];
                                                    else fo[cat.id] = cf;
                                                    return { ...prev, _fieldOverrides: fo };

                                    <div className="flex justify-end gap-2">

                        {/* Save Profile Confirmation */}
                        {saveConfirm && (() => {
                            const hasLinked = impactCount > 0;

                            return (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[60]">
                                <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 mx-4">
                                    <div className="flex items-center gap-3 mb-4">
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 ${accentBg}`}>

                                            </p>

                                    </div>
                                    <p className="text-sm text-yim-600 opacity-70 mb-3">
                                        {hasLinked
                                            ? `Wijzigingen aan "${profileEditForm.name}" worden direct doorgevoerd voor alle gekoppelde rollen:`

                                    </p>
                                    {hasLinked && (
                                        <div className="max-h-48 overflow-y-auto mb-5 p-3 bg-yim-50 rounded-lg border border-yim-200">
                                            <div className="flex flex-wrap gap-1.5">
                                                {linkedRoles.map(([key, r]) => (

                    </div>
                );
            }

            // ============ ROLE EDITOR MODAL ============

            // Apply preset to editForm
            const applyPreset = (presetId) => {
                const preset = presets.find(p => p.id === presetId);
                if (!preset) return;
                setEditForm(prev => ({
                    ...prev,
                    canReveal: preset.canReveal,
                    allowedCategories: { ...preset.allowedCategories }
                }));
            };

            // Match current editForm against presets
            const matchPreset = (form) => {
                return presets.find(preset => {
                    const catMatch = ALL_CATEGORY_IDS.every(k => !!preset.allowedCategories[k] === !!form.allowedCategories?.[k]);
                    const revealMatch = !!preset.canReveal === !!form.canReveal;
                    return catMatch && revealMatch;
                }) || null;
            };

            // Concept B: category group definitions for collapsible UI
            const categoryGroups = UI_GROUPS.map(ug => ({
                key: ug.id,
                label: ug.label,
                items: CATEGORIES.filter(c => c.uiGroup === ug.id),
                formKey: 'allowedCategories'
            }));

            // Category groups mapped through hierarchy for Concept C V3/V4 (formKey maps subcategory ID to the right bucket)
            const getFormKeyForSubcat = (subcatId) => {
                for (const h of CATEGORY_HIERARCHY) {
                    if (h.subcategories.some(s => s.id === subcatId)) {
                        if (h.id === 'persoonsgegevens') return 'categories';
                        if (h.id === 'dossier') return 'dossierCategories';
                        if (h.id === 'certificaten') return 'certCategories';
                        if (h.id === 'bestanden') return 'fileCategories';
                    }
                }
                return 'categories';
            };
            const isSubcatActive = (subcatId) => {
                const fk = getFormKeyForSubcat(subcatId);
                return !!editForm[fk]?.[subcatId];
            };

            // Wizard dead code removed — F uses same role editor as B

            // Defined outside if(selectedRole) to avoid Babel eval scope issues
            const totalCatMax = concept === 'C' ? ALL_GROUPS.length : ALL_CATEGORY_IDS.length;

            if (selectedRole) {
                const linkedProfile = concept === 'A' ? getProfileForRole(editForm) : null;
                const totalCatCount = concept === 'C'
                    ? ALL_GROUPS.filter(g => g.subcatIds.some(id => isSubcatActive(id))).length
                    : concept === 'G'
                    ? Object.values(editForm.allowedCategories || {}).filter(Boolean).length
                    : 0;
                const matchedPreset = concept === 'G' ? matchPreset(editForm) : null;
                return (
                    <div className="fixed inset-0 bg-yim-100 z-50 overflow-hidden flex flex-col">
