        // Patch roleSettings onto Concept A roles (initialRolesA defined before factories)
        initialRolesA.admin.roleSettings = createAdminRoleSettings();

        initialRolesA.security.roleSettings = createSecurityRoleSettings();

        // Concept E: Categorieën per rol + presets + harde grenzen + viewer badges
        const initialRolesE = {

              allowedScopes: { own_company: true, subcontractors: true } },
            security: { name: "Security Manager", description: "Compliance en toegang", canReveal: false, roleSettings: createSecurityRoleSettings(),
              allowedCategories: { identity: true, contact: false, government_id: false, employment: false, compliance: true, time_tracking: true, access: true, certificates: true, documents: false },
              allowedScopes: { own_company: true, subcontractors: false } },
            contractor: { name: "Contractor", description: "Beperkte toegang", canReveal: false, roleSettings: createSecurityRoleSettings(),
              allowedCategories: { identity: true, contact: false, government_id: false, employment: false, compliance: true, time_tracking: true, access: true, certificates: true, documents: false },

            guest: { name: "Guest", description: "Basis verificatie", canReveal: false, roleSettings: createMinimalRoleSettings(),

              allowedScopes: { own_company: true, subcontractors: false } }
        };

        function App({ roles, setRoles, visibilityProfiles, setVisibilityProfiles, currentTab, setCurrentTab, concept, setConcept, viewerContext, setViewerContext }) {
            const [currentRole, setCurrentRole] = useState('admin');
            const [showHelp, setShowHelp] = useState(true);
            const [auditLog, setAuditLog] = useState([]);

            const [showConceptInfo, setShowConceptInfo] = useState(false);

            const CONCEPT_INFO = {

                G: { title: 'Taakafleiding', color: 'bg-teal-500', how: 'Admin configureert alleen taken en rechten. Systeem berekent welke data zichtbaar moet zijn.', what: 'Categorieën worden afgeleid, niet handmatig gekozen. Override mogelijk maar gemarkeerd.', key: 'Minimale config, maximale traceerbaarheid' },

            // Concept F: match role config to preset name for viewer badges
            const matchPresetForViewer = (r) => INITIAL_PRESETS.find(p =>
                ALL_CATEGORY_IDS.every(k => !!p.allowedCategories[k] === !!r.allowedCategories?.[k]) &&
                !!p.allowedScopes?.subcontractors === !!r.allowedScopes?.subcontractors &&
                !!p.canReveal === !!r.canReveal

            const roleKeys = Object.keys(roles);
            const validRole = roles[currentRole] ? currentRole : roleKeys[0];
            const role = roles[validRole];

            // Resolve visibility based on active concept
            const profile = concept === 'A' ? visibilityProfiles.find(p => p.id === role.visibilityProfileId) : null;
            const canReveal = concept === 'A' ? (profile?.canReveal || false) : (role.canReveal || false);

            // Log field reveal
            const logFieldReveal = (category, field, value) => {
                const entry = {
                    timestamp: new Date().toISOString(),
                    role: role.name,
                    category,
                    field,
                    value: value.substring(0, 20) + (value.length > 20 ? '...' : ''),
                    action: 'FIELD_REVEAL'
                };
                setAuditLog(prev => [entry, ...prev]);
            };

            // Handle field reveal with 5-second timeout
            const handleReveal = (fieldKey, category, field, value) => {
                if (!canReveal) return;

                setRevealedFields(prev => ({ ...prev, [fieldKey]: true }));
                logFieldReveal(category, field, value);

                // Auto-hide after 5 seconds
                setTimeout(() => {
                    setRevealedFields(prev => {
                        const updated = { ...prev };
                        delete updated[fieldKey];
                        return updated;
                    });
                }, 5000);
            };

            // Mask sensitive values (no permission levels - purely based on sensitivity)
            const maskSensitiveValue = (value, sensitive, isRevealed = false) => {
                if (isRevealed || !sensitive) return value;
                if (typeof value === 'string') {
                    if (value.includes('@')) {
                        const [user, domain] = value.split('@');
                        return `${user.substring(0, 2)}••••@${domain}`;
                    }
                    if (value.includes('+31')) return '+31 6 ••••••78';
                    if (value.length > 8) return value.substring(0, 3) + '••••••';
                }
                return '••••••••';
            };

            const DataField = ({ label, value, sensitive, fieldId, groupId }) => {
                // Check visibility based on active concept
                // For B/E: map legacy field groupId to authorization category via FIELD_TO_CATEGORY
                const catId = FIELD_TO_CATEGORY[groupId] || groupId;
                // All concepts now use allowedCategories (on profile for A, on role for B/E/F, computed for C)
                const effectiveCats = concept === 'A' ? profile?.allowedCategories : role.allowedCategories;
                const effectiveScopes = concept === 'A' ? profile?.allowedScopes : role.allowedScopes;
                const baseVisible = effectiveCats?.[catId] === true;
                const isHardBlocked = (concept !== 'C') && viewerContext === 'cross_company' && HARD_BLOCKED.categories.has(catId);
                const isScopeBlocked = concept === 'C' && viewerContext === 'cross_company' && role.scopePerLevel && (role.scopePerLevel[CATEGORY_MIN_LEVEL[groupId] || 1] === 'own_company');
                // Scope blocking (subcontractors not allowed → block cross-company)
                const isScopeBlockedB = (concept !== 'C') && viewerContext === 'cross_company' && !effectiveScopes?.subcontractors;
                // Sensitivity guardrail (zeer_gevoelig + cross_company → platform-blocked)
                const isSensitivityBlocked = (concept !== 'C') && viewerContext === 'cross_company' && CATEGORY_SENSITIVITY[catId] === 'zeer_gevoelig';
                const isBlocked = isHardBlocked || isScopeBlocked || isScopeBlockedB || isSensitivityBlocked;
                const isVisible = baseVisible && !isBlocked;
                if (!isVisible && !isBlocked) return null;
                if (isBlocked) return (
                    <div className="flex justify-between items-start py-3 border-b border-yim-100 last:border-0">

                        </div>
                        <span className={`text-xs px-2 py-0.5 rounded border ${isHardBlocked ? 'text-purple-500 bg-purple-50 border-purple-200' : 'text-[#6daeba] bg-[#e8f4f7] border-[#6daeba]/20'}`}>
                            {isHardBlocked ? 'Platform-geblokkeerd' : 'Organisatie-beperkt'}
                        </span>
                    </div>
                );
                if (!isVisible) return null;

                const fieldKey = `${groupId}.${fieldId}`;
                const isRevealed = revealedFields[fieldKey];
                const displayValue = maskSensitiveValue(value, sensitive, isRevealed);
                const isMasked = sensitive && !isRevealed;
                const canRevealField = canReveal && isMasked;

                return (
                    <div className="flex justify-between items-start py-3 border-b border-yim-100 last:border-0 group">
                        <div className="flex items-center gap-2">

                                </svg>
                            )}

                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />

            const VisibilityBadge = ({ visible }) => {

                const secCats = concept === 'A' ? profile?.allowedCategories : role.allowedCategories;

                                                currentTab === 'admin'
                                                    ? 'bg-white text-yim-600 shadow-sm'
                                                    : 'text-yim-600 opacity-70 hover:text-yim-600'
                                            }`}
                                        >
                                            Admin
                                        </button>
                                    </div>
                                    {currentTab === 'viewer' && (concept === 'A' || concept === 'E') && (
                                        <button
                                            onClick={() => setShowHelp(!showHelp)}

                                        Hoe werkt dit?

                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto px-6 py-8">
                        {currentTab === 'viewer' && (
                        <>
                        {/* Company Context Switcher (all concepts except C which has its own) */}
                        {(concept === 'A' || concept === 'E' || concept === 'G') && (
                            <div className="mb-6 bg-purple-50 rounded-xl p-5 border border-purple-200">
                                <div className="flex items-center justify-between flex-wrap gap-4">

        // ============ DualListSelector Component ============
        function DualListSelector({ items, selected, onChange, maxHeight = 180 }) {
            const available = items.filter(i => !selected.includes(i.id));
            const selectedItems = items.filter(i => selected.includes(i.id));

            const addItem = (id) => onChange([...selected, id]);
            const removeItem = (id) => onChange(selected.filter(x => x !== id));

            const ListCol = ({ title, count, total, items: listItems, onClickItem, icon }) => (
                <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between mb-1.5">
                        <span className="text-xs font-semibold text-yim-500 uppercase tracking-wide">{title}</span>
                        <span className="text-xs text-yim-400">{count}/{total}</span>
                    </div>
                    <div className="border border-yim-200 rounded-lg bg-white" style={{ maxHeight, overflowY: 'auto' }}>
                        {listItems.length === 0 ? (
                            <div className="px-3 py-4 text-xs text-yim-400 text-center italic">Geen items</div>
                        ) : listItems.map(item => (
                            <div key={item.id} onClick={() => onClickItem(item.id)}
                                className="flex items-center gap-2 px-3 py-1.5 text-sm text-yim-700 hover:bg-yim-50 cursor-pointer border-b border-yim-100 last:border-b-0 transition-colors">
                                <span className="flex-1 truncate">{item.name}</span>
                                <span className="text-yim-400 text-xs flex-shrink-0">{icon}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="flex gap-3">
                    <ListCol title="Beschikbaar" count={available.length} total={items.length}
                        items={available} onClickItem={addItem} icon="→" />
                    <ListCol title="Geselecteerd" count={selectedItems.length} total={items.length}
                        items={selectedItems} onClickItem={removeItem} icon="←" />
                </div>
            );
        }

        // ============ RoleSettingsPanel Component (flat form layout matching Figma) ============
        function RoleSettingsPanel({ roleSettings, onChange }) {
            if (!roleSettings) return null;

            const updateField = (field, value) => {
                onChange({ ...roleSettings, [field]: value });
            };

            // Render a dual-list row with alternating background
            const renderRow = (row, rowIdx) => {
                const isEven = rowIdx % 2 === 0;
                return (
                    <div key={row.id} className={isEven ? 'bg-[#f0f5f7]' : 'border-t border-yim-200'}>
                        <div className="grid items-start p-4" style={{ gridTemplateColumns: '240px 1fr' }}>
                            <label className="text-base font-semibold text-yim-700 pr-5 py-2">{row.name}</label>
                            <DualListSelector items={row.items} selected={roleSettings[row.id] || []}
                                onChange={(val) => updateField(row.id, val)} maxHeight={140} />
                        </div>
                    </div>
                );
            };

            // Render a select/dropdown row
            const renderSelectRow = (row, rowIdx) => {
                const isEven = rowIdx % 2 === 0;
                return (
                    <div key={row.id} className={isEven ? 'bg-[#f0f5f7]' : 'border-t border-yim-200'}>
                        <div className="grid items-center p-4" style={{ gridTemplateColumns: '240px 1fr' }}>
                            <label className="text-base font-semibold text-yim-700 pr-5 py-2">{row.name}</label>
                            <select value={roleSettings[row.id] || ''} onChange={(e) => updateField(row.id, e.target.value)}
                                className="px-3 py-2.5 border border-yim-300 rounded bg-white text-sm focus:ring-2 focus:ring-yim-500 focus:border-yim-500" style={{ width: 320 }}>
                                <option value=""></option>
                                {row.options.map(opt => <option key={opt.id} value={opt.id}>{opt.name}</option>)}
                            </select>
                        </div>
                    </div>
                );
            };

            // Render a Ja/Nee toggle row (inside a card)
            const renderToggleRow = (label, field) => (
                <div className="bg-[#f0f5f7]">
                    <div className="grid items-center p-4" style={{ gridTemplateColumns: '240px 1fr' }}>
                        <label className="text-base font-semibold text-yim-700 pr-5 py-2">{label}</label>
                        <div className="inline-flex rounded border border-yim-200 overflow-hidden">
                            <button onClick={() => updateField(field, true)}
                                className={`px-8 py-2 text-sm font-medium transition-all ${roleSettings[field] ? 'bg-yim-500 text-white' : 'bg-white text-yim-600 hover:bg-yim-50'}`}>Ja</button>
                            <button onClick={() => updateField(field, false)}
                                className={`px-8 py-2 text-sm font-medium transition-all ${!roleSettings[field] ? 'bg-yim-500 text-white' : 'bg-white text-yim-600 hover:bg-yim-50'}`}>Nee</button>
                        </div>
                    </div>
                </div>
            );

            // Section header inside a card
            const renderSectionHeader = (name) => (
                <div className="px-12 py-5">
                    <h3 className="text-[30px] font-bold text-yim-700" style={{ fontFamily: 'Nunito, sans-serif' }}>{name}</h3>
                </div>
            );

            // Render a section card
            const renderSectionCard = (section) => (
                <div key={section.id} className="bg-white rounded-lg border border-yim-200 overflow-hidden">
                    {section.header && renderSectionHeader(section.name)}
                    {section.rows.map((row, rowIdx) =>
                        row.type === 'select'
                            ? renderSelectRow(row, rowIdx)
                            : renderRow(row, rowIdx)
                    )}
                </div>
            );

            return (
                <div className="space-y-3">
                    {ROLE_SETTINGS_SECTIONS.map(renderSectionCard)}

                    {/* Delegatie */}
                    <div className="bg-white rounded-lg border border-yim-200 overflow-hidden">
                        {renderSectionHeader('Delegatie')}
                        {renderToggleRow('Rol kan worden gedelegeerd', 'delegatie')}
                    </div>

                    {/* Bedrijven */}
                    <div className="bg-white rounded-lg border border-yim-200 overflow-hidden">
                        {renderSectionHeader('Bedrijven')}
                        {renderToggleRow('Accrediteer alle bedrijven', 'accrediteer_alle_bedrijven')}
                    </div>
                </div>
            );
        }

                                            {/* Nieuwe UX-groep toevoegen */}
                                            <button onClick={() => {
                                                const newId = 'ux_' + Date.now();
                                                setUxGroups(prev => [...prev, { id: newId, label: 'Nieuwe groep', description: '', presetIds: [] }]);
                                                setEditingUxGroupId(newId);
                                                setEditingUxGroupLabel('Nieuwe groep');
                                            }}
                                                className="w-full py-4 border-2 border-dashed border-yim-300 rounded-lg text-yim-500 font-semibold hover:border-yim-500 hover:text-yim-600 hover:bg-yim-50 transition-all flex items-center justify-center gap-2">
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
                                                Nieuwe UX-groep toevoegen
                                            </button>
                                        </div>
                                    </>
                                )}

                                {/* Other menu items - placeholder */}
                                {activeMenu !== 'roles' && activeMenu !== 'profiles' && activeMenu !== 'groups' && (
                                    <div className="flex items-start gap-4 mb-8">
                                        <div className="w-4 h-8 bg-yim-200 rounded-full mt-2"></div>
                                        <div>
                                            <h1 className="text-4xl font-bold text-yim-600">{menuItems.find(m => m.id === activeMenu)?.label}</h1>
                                            <p className="text-base font-bold text-yim-600 mt-1 opacity-50">Binnenkort beschikbaar</p>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Mijn Acties Panel */}
                            <div className="w-72 flex-shrink-0">
                                <div className="bg-yim-700 rounded-bl-lg rounded-br-lg rounded-tl-lg rounded-tr-[110px] px-5 pt-12 pb-8 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-28 h-28 bg-yim-600/30 rounded-bl-full"></div>
                                    <h3 className="text-3xl font-normal text-white mb-8">Mijn acties</h3>

                                    {activeMenu === 'roles' && (
                                        <button onClick={openNewRoleEditor} className="flex items-center gap-4 text-white w-full py-3 hover:bg-white/10 rounded-lg transition-colors">
                                            <div className="w-8 h-8 flex items-center justify-center">
                                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 4v16m8-8H4" /></svg>
                                            </div>
                                            <span className="text-lg font-semibold">Nieuwe rol toevoegen</span>
                                        </button>
                                    )}

                                    {activeMenu === 'profiles' && concept === 'A' && (
                                        <button onClick={openNewProfileEditor} className="flex items-center gap-4 text-white w-full py-3 hover:bg-white/10 rounded-lg transition-colors">
                                            <div className="w-8 h-8 flex items-center justify-center">
                                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 4v16m8-8H4" /></svg>
                                            </div>
                                            <span className="text-lg font-semibold">Nieuw profiel toevoegen</span>
                                        </button>
                                    )}

                                    <div className="mt-16 flex items-center gap-4 text-white">
                                        <div className="w-8 h-8 flex items-center justify-center">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                            </svg>
                                        </div>
                                        <span className="text-lg font-semibold">yimsupport@nsecure.nl</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Root Component with state management + concept toggle
        function Root() {
            const [concept, setConcept] = useState('A');
            const [rolesA, setRolesA] = useState(initialRolesA);
            const [rolesC, setRolesC] = useState(initialRolesC);
            const [rolesE, setRolesE] = useState(initialRolesE);
            const [rolesG, setRolesG] = useState(initialRolesG);
            const [visibilityProfiles, setVisibilityProfiles] = useState(initialVisibilityProfiles);
            const [currentTab, setCurrentTab] = useState('viewer');
            const [viewerContext, setViewerContext] = useState('own_company');

            const roles = concept === 'A' ? rolesA : concept === 'C' ? rolesC : concept === 'G' ? rolesG : rolesE;
            const setRoles = concept === 'A' ? setRolesA : concept === 'C' ? setRolesC : concept === 'G' ? setRolesG : setRolesE;

            return (
                <div>
                    {/* Fixture Toggle */}
                    <div className="bg-yim-950 text-white">
                        <div className="max-w-6xl mx-auto px-6 py-2.5 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <span className="text-xs font-medium text-white/50 uppercase tracking-wider">Concept</span>
                                <div className="flex bg-white/10 rounded-lg p-0.5">
                                    <button onClick={() => setConcept('A')} className={`px-2.5 py-1.5 text-xs font-semibold rounded-md transition-all ${concept === 'A' ? 'bg-yim-orange text-white shadow-sm' : 'text-white/60 hover:text-white'}`}>
                                        A: Profielen
                                    </button>
                                    <button onClick={() => setConcept('C')} className={`px-2.5 py-1.5 text-xs font-semibold rounded-md transition-all ${concept === 'C' ? 'bg-blue-500 text-white shadow-sm' : 'text-white/60 hover:text-white'}`}>
                                        C: Inzageniveau
                                    </button>
                                    <button onClick={() => setConcept('E')} className={`px-2.5 py-1.5 text-xs font-semibold rounded-md transition-all ${concept === 'E' ? 'bg-purple-500 text-white shadow-sm' : 'text-white/60 hover:text-white'}`}>
                                        E: Categorieën
                                    </button>
                                    <button onClick={() => setConcept('G')} className={`px-2.5 py-1.5 text-xs font-semibold rounded-md transition-all ${concept === 'G' ? 'bg-teal-500 text-white shadow-sm' : 'text-white/60 hover:text-white'}`}>
                                        G: Taakafleiding
                                    </button>
                                </div>
                            </div>
                            <p className="text-xs text-white/40">
                                {concept === 'A' ? 'Profiel = bron van waarheid · Profielwijziging raakt alle gekoppelde rollen'
                                 : concept === 'C' ? 'Inzageniveau met suggestie · Categorieën volgen uit rolinstellingen'
                                 : concept === 'G' ? 'Categorieën afgeleid uit taken · Handmatige override met waarschuwing'
                                 : 'Categorieën per rol · Presets · Harde grenzen bij cross-company'}
                            </p>
                        </div>
                    </div>
                    <App roles={roles} setRoles={setRoles} visibilityProfiles={visibilityProfiles} setVisibilityProfiles={setVisibilityProfiles} currentTab={currentTab} setCurrentTab={setCurrentTab} concept={concept} setConcept={setConcept} viewerContext={viewerContext} setViewerContext={setViewerContext} />
                </div>
            );
        }

        ReactDOM.render(<Root />, document.getElementById('root'));
    </script>
</body>
</html>
